# Applicability is the one real decision in this document.
#
# The narrow form — apply only when a task declares `change.public_contract` — hands the switch to
# the party most likely to be wrong about it. "Did I change a published interface?" is exactly the
# question an agent answers by eyeballing its own diff, and a task that answers `false` turns the
# check off entirely. The person who finds out is whoever's client breaks on the next release.
#
# So this applies to all change work, and the contract runner — not the author of the change —
# decides whether anything published moved. `change.public_contract` is not read here and never
# will be.
#
# `change.code` is a different question and is read, because the paragraph above answers *"is this
# diff compatible?"* and says nothing about *"is there a diff to run a contract runner over?"*. A
# task whose product is a document publishes no interface at all: `contracts.checked > 0` has no
# honest producer for it, and the requirement below is not strict but unsatisfiable — the run
# blocks on evidence nobody can make. The two facts differ in who can be wrong about them and how
# visibly:
#
#   * `change.public_contract` is a judgement about a diff's *effect*, made by the party least able
#     to make it, checkable only by the runner this principle demands;
#   * `change.code` is a statement about the task's *product*, settled before the diff exists,
#     written in the task document a reviewer reads, and wrong in a way that reviewer can see.
#
# It is still a declaration, so it can still be false. Nothing here enforces it — the mitigation is
# review, and `docs/design/fact-scoped-applicability-design-v0.1.md` § 5 says so plainly rather
# than dressing it up. Note what silence does: an *undeclared* `change.code` evaluates Unknown, and
# Unknown is not False, so a task that says nothing carries this rule in full.
id: contract-testing
version: 1
title: Contract testing
summary: >-
  Published interfaces stay compatible: contract checks pass and report no breaking change before a
  task can complete. Without it, a compatible-looking refactor ships as someone else's outage.

applies_when:
  all:
    - task.kind:
        any_of: [feature, bugfix, refactor]
    # Kleene conjunction, and it is the whole safety argument: `False` dominates, so a declared
    # `change.code: false` removes this rule whatever the kind is, and an absent `change.code`
    # leaves the conjunction Unknown — which `Principle::applies` keeps in force.
    - change.code

requires:
  # Two timings, and the second is not a stricter copy of the first: they read different numbers, at
  # different moments, for different reasons.
  #
  # `before_review` reads `contracts.breaking_changes` and deliberately not `contracts.failed`. The
  # two counts answer different questions — `failed` is *the contract run is red*, and
  # `breaking_changes` is *and somebody who already calls this interface was told something that is
  # no longer true*. A red run is exactly what a review is for: a person can weigh a failure that is
  # the runner's own machinery, decide it is noise, and say so. A broken consumer is not something a
  # review can decide, because the people affected are not in the room. So a change that broke a
  # published interface does not reach a reviewer at all, and one that merely failed its contract run
  # does.
  #
  # It also reads the one fact a `contract_result` alone projects. `tests.contract.failed` — which
  # the workflow's `verify -> adversarial_verify` guard reads — is an alias any test runner satisfies
  # with a suite it happened to name `contract`, and `drivers/development/checks.yaml` fills it from
  # `protocol validate`. `contracts.breaking_changes` has exactly one producer, so this is the first
  # point in the workflow where a contract *runner* must have spoken. Nothing observing it leaves the
  # fact Unknown, and Unknown does not permit a transition (invariant 5): a run with no contract
  # record does not enter review by saying nothing.
  before_review:
    predicates:
      - contracts.breaking_changes == 0
  before_completion:
    predicates:
      # A run that checked nothing also has zero failures, so the number of checks is part of the
      # obligation. Without this line an empty contract suite satisfies the principle.
      - contracts.checked > 0
      - contracts.failed == 0
      - contracts.breaking_changes == 0

evidence:
  - kind: contract_result
    verifier: contract-runner
    independent: true

verification:
  - verifier: contract-runner

# NOT checked: whether the contract set covers every published interface. `contracts.checked` is a
# count, not a coverage measure, so a project that publishes ten endpoints and has contracts for
# three satisfies this. Closing that needs a coverage fact the protocol does not declare.
on_failure: block

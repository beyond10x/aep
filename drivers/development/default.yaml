# The step map for `adp/default`: what a harness *does* in each state the workflow declares.
#
# The workflow says what states exist and what evidence each transition needs. It deliberately does
# not say how to obtain that evidence — that is a harness's business, and keeping it out of the
# workflow is what lets one workflow govern a Rust repository and a Terraform one. This document is
# the missing half, for this repository.
#
# Two properties are worth reading before the steps:
#
#   * every `cargo` line here is a **command step the driver runs**, never a tool the model holds.
#     This map's `llm` steps run under `development.standard`, which grants no `command.execute`,
#     so they hold no shell at all. (`development.driven` does grant it, held to the `protocol`
#     CLI by a hook — `profiles/development-driven.yaml:78`. This map does not use it.)
#     `tests.execute` is exercised by the driver, and the record it produces carries
#     `producer: verifier / test-runner` rather than a model's opinion of a test run. That is what
#     makes `independent: true` honestly satisfiable in `adversarial_verify`.
#   * an `llm` step has no `evidence:` key and cannot be given one. Anything a model is supposed to
#     have achieved that is *checkable* is observed by the command step after it.
#
# **This map's verifier is cargo, and it can drive nothing else.** Every state here that names a
# verifier names `cargo`: the suite is `cargo test --workspace`, the contract suite is
# `cargo test -p aep-conformance`, and static analysis is `cargo clippy`. A story whose acceptance
# is written in shell checks cannot be driven under it — not because the checks are refused, but
# because the suite the driver runs is a different suite: run `W4-1/1` wrote nine deliberately red
# shell checks in `establish_verifiers` and then `cargo test --workspace` recorded 138 suites `ok`,
# which is `test.first_result = passed`, which never changes
# (`crates/govern/aep-engine/src/execution.rs:366-378`). That run could not move afterwards by any route.
# Its sibling **[`checks.yaml`](checks.yaml)** — `development/checks` — is the map for that work: it
# verifies by running the checks the story itself carries, and names no compiler anywhere.
#
# **Two maps now fit `adp/default/1`, so `aep drive run` refuses to choose between them** and
# `--map` says which one. That refusal names both ids (`crates/edge/aep-cli/src/drive.rs:376-388`)
# and is the same position `aep artifact move` takes on an illegal transition: the driver does
# not guess which document the run is under.
format: aep.driver-steps/1
id: development/default
# Pinned, and the pin is mandatory. A step map names states and orders steps inside them, so an
# unpinned one is an instruction sheet for whatever happens to be in the tree. The refusal this
# comment used to predict has now happened once and worked exactly as written: `adp/default` went to
# version 2 and `aep validate` named both maps and both versions rather than applying either to
# a state graph it was not written against.
#
# **Repinned to version 2, with no new steps.** The bump added a terminal `declined` state and three
# edges out of failure — `adversarial_verify -> implement`, `review -> implement`,
# `review -> declined`. A terminal state takes no step, and the two back-edges re-enter `implement`,
# which this map already covers; the engine's own visit and attempt budgets bound the loop. What a
# run under this map gains is that an adversary which finds a defect can send the work back instead
# of wedging on the one forward edge.
workflow: adp/default/2
title: Driving adp/default in this repository

states:
  # `receive → specify` is unguarded: intake is done when there is something to specify. The step is
  # here so the run records what was asked for before anything reinterprets it.
  receive:
    steps:
      - kind: llm
        harness: b10x
        description: Read the task and record what is being asked for, unedited.
        skills: [planning]
        # **No `context:` any more, because the planning skill arrives as a skill.** The plugin is
        # supplied at the driver boundary through `--plugin-dir` or `AEP_DRIVE_PLUGIN_DIR`; AEP
        # owns the workflow and the driver while the external agentplugins repository owns the
        # harness-specific instruction surface.
        #
        # Eager delivery is not free, and a stateless loop makes that plain: the conversation is
        # replayed whole every turn, so this document was billed on turn one and on turn forty of
        # every run, six steps over, including the runs that never opened it. `context:` is still
        # right for a file a step genuinely reads throughout — that is what its own help says — and
        # a library the model chooses from is the other case.
        # Where this step may write. First match wins and the last rule is a catch-all, so a path
        # nobody thought of has an answer rather than a default. The planning store is denied to
        # native file writers because `aep artifact` owns every mutation, including bodies.
        scope:
          - paths: [".engineering/planning/**"]
            write: denied
          - paths: ["crates/**", "docs/**", "conformance/**", "drivers/**"]
            write: allowed
          - paths: ["**"]
            write: denied
        prompt: >-
          Read the task under `.engineering/` and the artifacts it references. Record what is being
          asked for in the planning store, in the requester's own terms. Do not design, do not
          decompose, and do not create anything the request does not name.

  specify:
    steps:
      - kind: llm
        harness: b10x
        description: State the required behaviour as a specification artifact.
        skills: [planning]
        # Where this step may write. First match wins and the last rule is a catch-all, so a path
        # nobody thought of has an answer rather than a default. The planning store is denied to
        # native file writers because `aep artifact` owns every mutation, including bodies.
        scope:
          - paths: [".engineering/planning/**"]
            write: denied
          - paths: ["crates/**", "docs/**", "conformance/**", "drivers/**"]
            write: allowed
          - paths: ["**"]
            write: denied
        prompt: >-
          Write the specification for this task as a planning artifact of kind `specification`,
          through `aep artifact new`. State the required behaviour so that a verifier could
          disagree with it: anything left only in the prompt cannot be checked later. The transition
          out of this state is guarded on `artifact.specification.exists`, so the artifact is what
          moves the run, not a description of one.

  decompose:
    steps:
      - kind: llm
        harness: b10x
        description: Break the specification into units that can each be verified alone.
        skills: [planning]
        # Where this step may write. First match wins and the last rule is a catch-all, so a path
        # nobody thought of has an answer rather than a default. The planning store is denied to
        # native file writers because `aep artifact` owns every mutation, including bodies.
        scope:
          - paths: [".engineering/planning/**"]
            write: denied
          - paths: ["crates/**", "docs/**", "conformance/**", "drivers/**"]
            write: allowed
          - paths: ["**"]
            write: denied
        prompt: >-
          Break the specification into tasks that can each be implemented and verified on their own,
          through `aep artifact new` and `aep artifact relate`. Every task states its own
          acceptance. A unit nobody can verify separately is a unit that will be declared done by
          assertion.

  establish_verifiers:
    steps:
      - kind: llm
        harness: b10x
        description: Write the tests before there is an implementation to shape them around.
        skills: [planning]
        # Where this step may write. First match wins and the last rule is a catch-all, so a path
        # nobody thought of has an answer rather than a default. The planning store is denied to
        # native file writers because `aep artifact` owns every mutation, including bodies.
        scope:
          - paths: [".engineering/planning/**"]
            write: denied
          - paths: ["crates/**", "docs/**", "conformance/**", "drivers/**"]
            write: allowed
          - paths: ["**"]
            write: denied
        prompt: >-
          Write the failing tests, contracts and checks that will decide whether each decomposed
          unit is done. Write no implementation in this state. The next transition is guarded on
          `test.exists`, and the guard — not good intentions — is what enforces the order.
      # Expected red. `test.exists` is what the guard reads, and a suite that fails here is the
      # point of the state: a test that passes before the code exists is a test of nothing.
      - kind: command
        description: Run the suite so that a test result exists, whatever it says.
        run: [cargo, test, --workspace]
        evidence:
          kind: test_result
          suite: unit
          verifier: test-runner
      # A person, and the step this map did not have. `spec-driven.before_implementation` wants a
      # specification whose status is `approved`, `aep artifact new` leaves `draft`, and no
      # prompt in this map used to ask for the move — so a run under it walked into `implement`
      # only because nothing had looked, or did not walk in at all. It is an `operator` step and
      # not an `llm` one because approving a specification is a person's act: a run that approved
      # its own specification would satisfy the principle by writing to the document the principle
      # is about, which is invariant 7 one layer up.
      #
      # Last in the state, after the suite has run red, so the person is asked once with the
      # state's mechanical work already done — the same order `checks.yaml` takes.
      - kind: operator
        description: Approve the specification, or say what is wrong with it.
        prompt: >-
          Read the specification this run wrote and the suite it just ran red. If it states the
          required behaviour well enough for those tests to decide it, move it to `approved` —
          `aep artifact move <id> in_review` then `aep artifact move <id> approved`. If
          it does not, leave it in `draft` and say so: the transition into `implement` is guarded
          on an approved specification, so the run stops here either way and nothing is implemented
          against a specification nobody agreed to. Write each requirement so that a fact decides
          it — `protocol specification evidence` reads a list item under `## Acceptance` and
          resolves the predicate it names in backticks, so `the suite is green` states nothing and
          `` `tests.unit.failed == 0` `` states a requirement.

  implement:
    steps:
      - kind: llm
        harness: b10x
        description: Make the smallest change that satisfies the unit and its verifiers.
        skills: [planning]
        # Where this step may write. First match wins and the last rule is a catch-all, so a path
        # nobody thought of has an answer rather than a default. The planning store is denied to
        # native file writers because `aep artifact` owns every mutation, including bodies.
        scope:
          - paths: [".engineering/planning/**"]
            write: denied
          - paths: ["crates/**", "docs/**", "conformance/**", "drivers/**"]
            write: allowed
          - paths: ["**"]
            write: denied
        prompt: >-
          Make the smallest change that satisfies the decomposed unit and the verifiers written for
          it. Do not weaken a check to make it pass; the workflow has an explicit route back here
          from `verify`, and taking it is cheaper than a suite nobody trusts.
      # `verifier: git` is an external tool, which is deliberate and is exercised here rather than
      # only in a test: `default_verifiers` is a table of defaults, not of constraints, so a step
      # naming a tool the protocol has never heard of loads, and its kind is checked at run start
      # against the protocol instead.
      - kind: command
        description: Observe that the working tree actually changed.
        run: [git, --no-pager, diff, --stat, HEAD]
        evidence:
          kind: diff
          verifier: git

  verify:
    steps:
      - kind: command
        description: The unit suite.
        run: [cargo, test, --workspace]
        evidence:
          kind: test_result
          suite: unit
          verifier: test-runner
      # Contracts are in the transition guard because a change that passes its own tests can still
      # break a consumer. The suite that answers that here is the contract conformance crate.
      - kind: command
        description: The contract suites.
        run: [cargo, test, -p, aep-conformance]
        evidence:
          kind: test_result
          suite: contract
          verifier: test-runner
      - kind: command
        description: Static analysis, warnings as errors.
        run: [cargo, clippy, --workspace, --all-targets, --, -D, warnings]
        evidence:
          kind: static_analysis
          verifier: static-analyzer
      # `contracts.breaking_changes == 0` is what `contract-testing` owes **before review**, and it
      # is the one fact only a `contract_result` projects — `tests.contract.failed`, which the step
      # above fills, is an alias any test runner satisfies. So this is a different question from the
      # conformance suite and needs its own record.
      #
      # The consumer/provider contract this repository actually publishes is the sealed
      # `metaharness.frame/1` document and the `contract_result` shape it reads back: two suites,
      # both against the one external consumer, both of which fail when what a consumer was told is
      # no longer true. That is what a contract runner is for, and `aep-conformance` is not it —
      # that suite asks whether a *backend* implements the storage contract, which is a different
      # question sharing a word.
      #
      # Minted from the exit status rather than read from a document, and this is the one of the
      # four kinds where that is honest: `contract_result` is in `EvidenceMapping::MINTABLE`
      # because *did the runner produce a verdict, and was it yes or no* is the whole of what the
      # counts need here. The committed records under
      # `crates/edge/aep-cli/fixtures/metaharness-contract-result-*.json` are deliberately **not**
      # used: they are the provider's captured bytes from 2026-08-23, they describe metaharness's
      # adapters rather than the change under review, and `protocol contract evidence` requires an
      # `--observed-at` that a committed map could only supply as a literal — a map claiming a fresh
      # observation of a run made months ago, every day, for ever, which is exactly what evidence
      # horizons exist to catch.
      - kind: command
        description: The contracts the one external consumer was told about still hold.
        run:
          - cargo
          - test
          - -p
          - aep-cli
          - --test
          - metaharness_frame_contract
          - --test
          - metaharness_contract_result
        evidence:
          kind: contract_result
          verifier: contract-runner
      # `property-based-testing` owes an independent `property_test_result` from a
      # `property-tester`, and the kind is not mintable: the payload names a property, a case count
      # and a seed, and an exit status holds none of them. So the checker writes its own record and
      # the driver reads it — `record:`, the same route `checks.yaml` takes for `trace_conformance`.
      - kind: command
        description: The three-valued core's algebra, over every input there is.
        run:
          - protocol
          - property
          - evidence
          - --out
          - "{run_directory}/property.yaml"
        evidence:
          kind: property_test_result
          verifier: property-tester
          record: "{run_directory}/property.yaml"
      # `provenance-tracking` owes an independent `verification` record before completion, and the
      # kind is not mintable either: a `verification` names a claim and a verifier, and an exit
      # status names neither. `aep validate` is the verifier — it reads every protocol,
      # workflow, profile, lifecycle and step map and cross-validates them against each other — and
      # `--evidence` is it writing down what it found. The claim is `document-tree-valid` and
      # deliberately not `invariant`: `verification.invariant.passed` is read by three shipped
      # documents that mean something else by it.
      - kind: command
        description: The document tree still loads and still cross-validates.
        run:
          - protocol
          - validate
          - --root
          - "."
          - --evidence
          - "{run_directory}/verification.yaml"
        evidence:
          kind: verification
          verifier: protocol
          record: "{run_directory}/verification.yaml"

  adversarial_verify:
    steps:
      - kind: llm
        harness: b10x
        description: Try to break what the previous state just declared working.
        skills: [planning]
        # Where this step may write. First match wins and the last rule is a catch-all, so a path
        # nobody thought of has an answer rather than a default. The planning store is denied to
        # native file writers because `aep artifact` owns every mutation, including bodies.
        scope:
          - paths: [".engineering/planning/**"]
            write: denied
          - paths: ["crates/**", "docs/**", "conformance/**", "drivers/**"]
            write: allowed
          - paths: ["**"]
            write: denied
        prompt: >-
          Try to break what `verify` just declared working: edge cases, property violations,
          contract drift, a mutant the suite would not catch. Write the cases that fail. You are not
          the author here even when you wrote the code, and a state that only re-ran the author's
          own suite would make the author and the adversary one actor.
      - kind: command
        description: Run the suite again, with whatever the adversary added.
        run: [cargo, test, --workspace]
        evidence:
          kind: test_result
          suite: unit
          verifier: test-runner
      # The same command, asked a different question, and the duplication is the point rather than
      # an oversight. `tests.unit.failed == 0` is *this change's tests pass*;
      # `regression_suite.result == passed` is *everything that already worked still works* — and
      # `test-driven` owes the second before completion. The coverage pre-flight cannot see that
      # obligation at all, because it is a predicate rather than an evidence requirement
      # (`crates/drive/aep-driver/src/coverage.rs`, § "What this cannot see"), so a map without this step
      # passes the launch check and then blocks at completion with nothing to say why.
      #
      # A step declares one evidence mapping, so one suite label per run of the command. Relabelling
      # the step above instead would be cheaper and wrong: the run would then carry no `unit` result
      # from the state where the adversary's cases ran.
      - kind: command
        description: The existing suite, as a regression check on what the adversary added.
        run: [cargo, test, --workspace]
        evidence:
          kind: test_result
          suite: regression
          verifier: test-runner
      # Last, and last on purpose: it reads the run's own snapshot, so every record the states
      # before it produced is in front of it. `spec-driven` owes `specification.satisfied` before
      # completion and only a `specification` record projects it — a record that names, requirement
      # by requirement, what is not met. An exit status names none of them, so the checker writes
      # the document and the driver reads it.
      #
      # What counts as a requirement is `protocol specification evidence`'s own decision and its
      # module documentation states it in full: a list item under a `Requirements` or `Acceptance`
      # heading, satisfied when the predicate it names in backticks is observed `True`. A ticked
      # checkbox is deliberately not the rule — the party that writes the specification is the party
      # being checked.
      #
      # The verb refuses, and submits nothing, when it cannot tell which specification the run is
      # about: more than one in force and none of them the one the task references is D5's
      # `Unknown`, not a guess.
      #
      # `--task {task}` is the document *this run* was started from, filled in by the driver. Without
      # it the verb falls back to its own discovery — the task `project.yaml` names — so a run driven
      # with `aep drive run --task <a path that is not the project's>` decided the wrong story's
      # specification, or refused over it, while the engine's cursor said something else entirely.
      # A step map is written once and driven many times, so this is the only way it can say
      # *whichever task this run is about*.
      - kind: command
        description: Decide the specification's requirements against what this run observed.
        run:
          - protocol
          - specification
          - evidence
          - --store
          - .engineering/planning
          - --task
          - "{task}"
          - --snapshot
          - "{run_directory}/snapshot.json"
          - --out
          - "{run_directory}/specification.yaml"
        evidence:
          kind: specification
          # `protocol`, the external tool, and not `artifact-validator`: the protocol joins
          # `specification` to `test-runner` and `human-review`, and neither is what this is. A
          # verifier the protocol has never heard of is admitted and checked at run start, which is
          # the honest shape — the record says which tool decided the document.
          verifier: protocol
          record: "{run_directory}/specification.yaml"

  # A person, and there is no route around them. `review → complete` is guarded on
  # `review.approved`, which is a record a human review produces: the driver constructs no approval
  # and stamps no `producer: human`, so this state is where a run stops and waits.
  review:
    steps:
      - kind: operator
        description: Judge the change as a whole — intent, fit and risk, not just green checks.
        prompt: >-
          Review this change as a whole. The run has stopped and released its lock; record your
          review as evidence and resume it. Nothing the driver can do satisfies this state.

  # Terminal. No steps, and none would run: the engine reports `Completed` on arrival.
  complete:
    steps: []

# Which shipped plugin surface teaches which workflow — and, where nothing does, the gap by name.
#
# ## Why this file exists
#
# `workflows/` declares four state machines. `integrations/` ships two plugins. Nothing joined the
# two, so "the plugin teaches the workflow" was a sentence a reader had to take on trust, and the
# more interesting half — *which states nothing teaches* — was not written down anywhere at all. A
# three-arm evaluation that measures how well a harness follows these workflows needs to know, before
# it spends a model budget, which arm can even be expected to know what it is being asked for.
#
# ## What this file is not
#
# **Not a protocol document kind.** `protocol validate` does not read it, it publishes no schema
# under `schemas/generated/`, and no engine decision turns on it. Its parser and every rule below
# are `crates/protocol-cli/tests/workflow_coverage.rs`, which is a step of `task check`. If this
# document and that test ever disagree, the test is what a reader should believe — it is the half
# that runs.
#
# ## Every claim here is checked
#
# The test refuses, by name:
#
# * a workflow document under `workflows/` whose declared id has no entry here;
# * an entry naming a workflow id no document declares, or a `document:` path that does not declare
#   the id beside it;
# * a `surface:` that is not a file under `integrations/`;
# * a state named in `states:` that its workflow does not declare;
# * a state of a workflow that is neither covered nor named in a gap — coverage is **total** or it is
#   an opinion;
# * a state claimed as covered *and* named in a gap;
# * a gap with no `reason`, or a coverage row with no `teaches`.
#
# The totality rule is the load-bearing one. A map that only lists what is covered goes green the day
# a workflow gains a state, which is the day the claim stops being true.

format: plugin-coverage/1
id: integrations/workflow-coverage
title: The plugin surface that teaches each shipped workflow, and the gaps where none does

workflows:
  # --------------------------------------------------------------------------------------------
  - workflow: adp/default
    document: workflows/development/default.yaml
    covered_by:
      - surface: integrations/claude-code/skills/planning/SKILL.md
        harness: claude-code
        states: [receive, specify, decompose]
        teaches: >-
          The store as the place a request is written down unedited, a specification becomes an
          artifact, and the artifact is broken into stories — through `protocol artifact new`,
          `relate`, `move` and `validate`, with the vocabulary read from the CLI rather than
          recited.

      - surface: integrations/codex/skills/planning/SKILL.md
        harness: codex
        states: [receive, specify, decompose]
        teaches: >-
          The same three states, ported. The guardrails and the discovery rule are identical because
          they are rules about the CLI and not about the harness; only the tool names differ.

      - surface: integrations/codex/AGENTS.planning.md
        harness: codex
        states: [receive, specify, decompose]
        teaches: >-
          The same four guardrails as an always-on instruction fragment, for the turn in which the
          model decides not to open a skill. A rule that only holds once a skill is loaded does not
          hold in the turn where the decision to load it is made.

      - surface: integrations/claude-code/skills/planning/references/store-conventions.md
        harness: claude-code
        states: [specify, decompose]
        teaches: >-
          The on-disk format an artifact takes — which half of the file the CLI owns and which half
          a person does. Harness-neutral by construction: the Codex skill references this same file
          rather than carrying a second copy.

      - surface: integrations/claude-code/agents/decomposer.md
        harness: claude-code
        states: [decompose]
        teaches: >-
          Joint coverage, independent demonstrability and no overlap as the three properties a
          decomposition is judged on, with a charter that is also a bound: draft stories only, no
          status moved, nothing touched that it did not create.

      - surface: integrations/claude-code/agents/plan-reviewer.md
        harness: claude-code
        states: [decompose]
        teaches: >-
          The five drifts a well-formed store can still hold — a story that stopped covering its
          epic, a finished epic still open, stale work, a missing acceptance statement, an orphan —
          and that a reviewer proposes moves and performs none.

    gaps:
      - id: no-implementor-or-verifier-agent
        states: [establish_verifiers, implement, verify, adversarial_verify]
        reason: >-
          Neither plugin ships an implementor or a verifier, and the Claude Code README says why:
          `protocol drive` is the loop that puts the capability policy in force per state, so an
          implementor no longer has to discover what it may use — and a verifier agent would emit
          evidence that looks independent and is not, because `independent: true` is checked
          structurally and nothing signs a record (gap register D-3, proposed and unaccepted). Four
          of the nine states of the repository's own development workflow are therefore taught by
          nothing either plugin carries.

      - id: no-review-or-completion-surface
        states: [review, complete]
        reason: >-
          `review -> complete` guards on `review.approved`, and an approval is a record the driver
          may not mint at all under invariant 7 — nothing below the driver would stop a harness
          writing its own approval and unlocking a capability with it. A plugin surface that taught
          an agent how to satisfy this guard would be teaching it to forge the one record that has
          to come from a person.

  # --------------------------------------------------------------------------------------------
  - workflow: release/progressive
    document: workflows/releases/progressive.yaml
    covered_by: []
    gaps:
      - id: no-release-surface
        states: [qualify, stage, canary, observe, promote, verify, complete]
        reason: >-
          Both plugins are planning plugins. Nothing in either mentions a release, a canary or a
          telemetry query, and the workflow's own decision — that `observe` is a state and not a
          pause — is exactly the kind of sequencing an agent gets wrong when nothing told it. This
          is the whole workflow, uncovered, and it is the gap the evaluation's release cases measure
          the raw arm against.

  # --------------------------------------------------------------------------------------------
  - workflow: incident/standard
    document: workflows/incidents/standard.yaml
    covered_by: []
    gaps:
      - id: no-incident-surface
        states: [detect, triage, diagnose, mitigate, recover, verify, learn]
        reason: >-
          As above, and with a sharper cost: `diagnose` requires a hypothesis to have been *tested*
          before `mitigate`, and `learn` is a state rather than a follow-up somebody means to write.
          Both are orderings a model under time pressure abandons first, and no shipped surface
          states either.

  # --------------------------------------------------------------------------------------------
  - workflow: migration/forward-only
    document: workflows/migrations/forward-only.yaml
    covered_by: []
    gaps:
      - id: no-migration-surface
        states: [plan, prepare, migrate, verify, complete]
        reason: >-
          As above. The workflow's premise — that a data migration has no rollback, so the recovery
          plan is a forward one prepared before the migration runs — is the single fact an agent
          most needs told, and neither plugin tells it.

domain: aep.evidence

summary: >-
  How `aep plan artifact evidence <id> --from <report> --suite <suite>` admits an
  `ess-conformance-report/2` and the exact original suite it ran: which reader a suite goes to by
  what it is, the suite's binding to the report by version and by digest, and the record it
  writes, and the producer profiles a report may name with the execution status each one implies,
  and how the record names its inputs: by a path relative to the repository root, or by file name
  for an input outside it, each beside its digest. And the per-task spend record: the model calls,
  tokens, cost, wall time and llm steps one source attributes to one artifact, each figure absent
  when the source does not state it, and the source named by its path from the repository root.
  Declared for story:evidence-admits-ordinary-ess-suites,
  story:evidence-admits-generated-runner-profile, story:evidence-records-relative-inputs,
  story:task-spend-is-modelled and story:evidence-records-task-spend.

# Paths are relative to the repository root. `planning.rs` is crates/edge/aep-cli/src/planning.rs,
# `counts.rs`, `count_suite.rs`, `coverage.rs` and `ordinary_suite.rs` are under
# crates/observe/aep-ess-evidence/src/, and `ess_conformance_v2.rs`, `ess_conformance_coverage.rs`
# and `values.rs` are under crates/govern/aep-domain/src/ (`values.rs` in
# `ess_conformance_coverage/`), unless a path says otherwise. Functions are named rather than
# lines, because the change moves them.
#
# Not modelled here: a report/1 (`--from` without `--suite`), `--suite-input` lineage, the
# coverage reader's own admission (story:current-ess-coverage-suites), the closed vocabulary each
# reader checks in the report and the suite (unknown fields, statuses, the runner name and version
# an external profile carries, counts against outcomes, the conformance status, scenario id forms
# gated by major), the spec-digest and selected-id pairing
# (`ModelDigestMismatch`, `SelectedIdsMismatch` in counts.rs `admit_suite`, unchanged), the
# planning store's own refusals of the artifact id, and whether a record counts toward a move
# (`conformance_count.rs` judges a record already written; `evidence` prints that judgement for
# the record it wrote). The rule for how a record names its inputs (aep.evidence.InputForm) is
# declared on this command and holds as well for the report/1 and coverage records, which name
# their inputs through the same function (planning.rs `recorded_input`).
#
# change (story:task-spend-is-modelled): the spend record (aep.evidence.SpendRecord and
# aep.evidence.RecordSpend) is declared ahead of its code. On 0.71.3 no evidence kind carries a
# model call, a token or a cost: `RunOutcome`, `RunUsage` and `ModelUsage` hold them per
# transcript (crates/observe/trace-domain/src/ir.rs), `Census::api_requests` the calls, and
# `eval.run-manifest/1` per eval run (`RawRunManifest` in crates/edge/aep-cli/src/eval.rs:
# `cost_micro_usd`, `tokens`, `wall_time_ms`).
#
# change (story:evidence-records-task-spend): the record is written by
# `aep plan artifact evidence <id> --kind task_spend --from <file>` (planning.rs
# `record_evidence`, `planning/task_spend.rs` `read_spend`) as one `task_spend` evidence file
# whose source is the record's JSON. Two additions: `total_tokens`, the one total an
# `eval.run-manifest/1` states (its `tokens`), which no split figure could hold; and
# `source_input`, the source's path from the repository root. Unlike a report or a suite
# (aep.evidence.InputForm `file_name`), a spend source outside the root is refused, not named by
# its file name: the record is about this repository's work and names where in it the source is.

types:
  # read from: the artifact id `evidence <id>` names (planning.rs `record_evidence`, `artifact_id`).
  - name: aep.evidence.ArtifactId
    kind: newtype
    of: String

  # read from: the name the record is written under, `evidence-<id>-<kind>-<millis>`
  # (planning.rs `evidence_through_a_command`), one file under `.engineering/evidence/`.
  - name: aep.evidence.RecordName
    kind: newtype
    of: String

  # change (story:evidence-admits-ordinary-ess-suites): what a suite major is, by the build's own
  # lists, never by its number alone. The lists are deliberate edits: a major ESS adds later is
  # `unknown` here until AEP lists it.
  - name: aep.evidence.SuiteKind
    kind: enum
    variants:
      - count_stage   # `ess-conformance/1`–`/4`, the frozen count reader's (ess_conformance_v2.rs `SuiteReference::new`)
      - ordinary      # an even major in `ORDINARY_SUITE_MAJORS` (ess_conformance_v2.rs): no `coverage` block
      - coverage      # an odd major in `COVERAGE_SUITE_MAJORS` (values.rs): carries a `coverage` block
      - unknown       # any other spelling or major, e.g. `ess-conformance/46` from an ESS newer than this build

  # change (story:evidence-admits-generated-runner-profile): the report's `producer_profile`, read
  # by both readers (`ProducerProfile::from_wire` in ess_conformance_v2.rs, called from counts.rs
  # and coverage.rs `read_report`). On 0.71.1 `go-scenario-status/2`, which the generated Go and
  # TypeScript runners of ESS 0.56.0 and later write, was `unknown`. A profile ESS adds later is
  # `unknown` here until AEP lists it.
  - name: aep.evidence.ProducerProfile
    kind: enum
    variants:
      - rust_scenario_status_1      # `rust-scenario-status/1`: passed, failed, error, unsupported; never skipped
      - go_scenario_status_1        # `go-scenario-status/1`: passed, failed, skipped; never error or unsupported
      - go_scenario_status_2        # `go-scenario-status/2`: all five categories
      - external_scenario_status_1  # `external-scenario-status/1`, alone or with `;runner=<name>@<version>`: the Rust categories
      - unknown                     # any other spelling, e.g. `go-scenario-status/3`

  # read from: the report's `execution_status` (counts.rs and coverage.rs `status`).
  - name: aep.evidence.ExecutionStatus
    kind: enum
    variants:
      - passed
      - failed
      - inconclusive

  # change (story:evidence-records-relative-inputs): how a record names a file it read
  # (`report_input`, `suite_input`, and the `reference` it writes when `--ref` gives none),
  # decided by planning.rs `recorded_input` against the repository root the store is in
  # (`StoreLocation::repository_root`), both made absolute and normalized without resolving a
  # link. On 0.71.2 every input was named as typed, so an absolute local path reached the record.
  - name: aep.evidence.InputForm
    kind: enum
    variants:
      - repository_relative  # inside the root: the path from the root, `/`-separated, no `.` or `..` component
      - file_name            # outside the root: the file's name alone, no directory component
      - as_typed             # anything else: an absolute path, or one with a parent component

  # change (story:evidence-records-relative-inputs): `sha256:` and the 64 lowercase hex digits of
  # the SHA-256 of the input's bytes as read (planning.rs `recorded_input`).
  - name: aep.evidence.InputDigest
    kind: newtype
    of: String

  # change (story:task-spend-is-modelled): the one source a spend record's figures come from.
  - name: aep.evidence.SpendSource
    kind: enum
    variants:
      - transcript    # a harness transcript: its terminal record (`RunOutcome`, `RunUsage`, ir.rs) and its requests (`Census::api_requests`, ir.rs)
      - run_manifest  # an `eval.run-manifest/1` (`RawRunManifest`, eval.rs)
      - driven_run    # a driven run's report, the `cursor.json` it persists (`DriverCursor`, crates/drive/aep-driver-spec/src/cursor.rs): the llm steps its step map declares and the ones it ran

entities:
  # One evidence record in the planning store: an immutable file under `.engineering/evidence/`,
  # written once by `evidence` (AGENTS.md *Planning store*). Only the facts this admission writes.
  - name: aep.evidence.ConformanceRecord
    naming:
      summary: A recorded report/2 run against an exact count-stage or ordinary suite.
    identity:
      name: record
      type: aep.evidence.RecordName
    fields:
      - name: artifact
        type: aep.evidence.ArtifactId
        summary: The artifact the record is evidence for.
      - name: suite_version
        type: String
        summary: >-
          The suite's `provenance.suite_version`, equal to the report's `suite.version`; written
          into the record's source as `suite.version` (planning.rs `recorded_from_report`).
      - name: suite_kind
        type: aep.evidence.SuiteKind
        summary: "`count_stage` or `ordinary`: the two kinds this admission records."
      - name: producer_profile
        type: aep.evidence.ProducerProfile
        summary: >-
          The report's profile, written into the record's source as `producer_profile` exactly as
          the report spells it (ess_conformance_v2.rs `facts`).
      - name: execution_status
        type: aep.evidence.ExecutionStatus
        summary: The report's `execution_status`, once the outcomes above have agreed with it.
      - name: completed_at
        type: Timestamp
        summary: The report's own `completed_at`, never this process's clock.
      # change (story:evidence-records-relative-inputs): on 0.71.2 these were the paths as typed.
      - name: report_input
        type: String
        summary: >-
          The report, named as aep.evidence.InputForm `repository_relative` or `file_name`;
          written into the record's source as `report_input`.
      - name: report_input_digest
        type: aep.evidence.InputDigest
        summary: The report's digest, written into the record's source as `report_input_digest`.
      - name: suite_input
        type: String
        summary: >-
          The suite, named the same way; written into the record's source as `suite_input`.
      - name: suite_input_digest
        type: aep.evidence.InputDigest
        summary: The suite's digest, written into the record's source as `suite_input_digest`.
      - name: reference
        type: String
        summary: >-
          The record's `reference` when `--ref` gives none: `report_input`, `@`, and
          `report_input_digest`, e.g. `reports/run.json@sha256:<64 hex>`. A `--ref` is the
          caller's words and is written as given.
    lifecycle:
      # An evidence file is never edited or deleted (AGENTS.md *Planning store*, rule 2).
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # change (story:task-spend-is-modelled): what one source says one task spent, the task being the
  # artifact the run or session worked on. Every figure is optional: a figure the source does not
  # state is absent, never zero (invariant *Unknown differs from false*), as each one already is
  # in `RunOutcome`, `RunUsage` and `RawRunManifest`. Integers throughout; a cost a transcript
  # states in US dollars (`total_cost_usd`, `ModelUsage::cost_usd`) is recorded in micro-USD, the
  # unit `eval.run-manifest/1` already writes (`cost_micro_usd`).
  #
  # change (story:evidence-records-task-spend): a transcript's token, cost and wall-time figures
  # are folded per session (planning/task_spend.rs `transcript_figures`, eval.rs
  # `every_session`): within one session the largest of its terminal records, which restate
  # running counters, and across sessions their sum. A figure is absent for the task when any
  # session states none, when a session never reaches a terminal record, or when the sum
  # overflows: a sum over some of the sessions understates the task by the ones left out.
  - name: aep.evidence.SpendRecord
    naming:
      summary: The model calls, tokens, cost, wall time and llm steps one source attributes to one task.
    identity:
      name: record
      type: aep.evidence.RecordName
    fields:
      - name: artifact
        type: aep.evidence.ArtifactId
        summary: The artifact the spend is attributed to.
      - name: source
        type: aep.evidence.SpendSource
        summary: The one source every figure of this record is read from.
      - name: source_digest
        type: aep.evidence.InputDigest
        summary: "`sha256:` and the SHA-256 of the source's bytes as read, as aep.evidence.InputDigest says."
      # change (story:evidence-records-task-spend): new.
      - name: source_input
        type: String
        summary: >-
          The source, named as aep.evidence.InputForm `repository_relative` after every link in
          its path and in the root's is resolved, so it names the file whose bytes were read;
          never a file name alone and never an absolute path.
      - name: model_calls
        type: Optional<Integer>
        summary: >-
          Distinct API requests the transcript records (`Census::api_requests`,
          `api_request_count` in ir.rs). Absent when the source records none.
      - name: input_tokens
        type: Optional<Integer>
        summary: Uncached input tokens (`RunUsage::input_tokens`).
      - name: output_tokens
        type: Optional<Integer>
        summary: Output tokens (`RunUsage::output_tokens`).
      - name: cache_read_tokens
        type: Optional<Integer>
        summary: Tokens read from the cache (`RunUsage::cache_read_input_tokens`).
      - name: cache_write_tokens
        type: Optional<Integer>
        summary: Tokens written to the cache (`RunUsage::cache_creation_input_tokens`).
      - name: thinking_tokens
        type: Optional<Integer>
        summary: Billed thinking tokens the API reported (`RunUsage::thinking_tokens`).
      # change (story:evidence-records-task-spend): new. A manifest states one total and no split,
      # so its split figures stay absent and this holds its `tokens`. One rule for every source,
      # the one `aep eval run` writes a manifest's `tokens` by (eval.rs `TOKEN_KEYS`): thinking
      # tokens are not added, since an API's output count may already hold them.
      - name: total_tokens
        type: Optional<Integer>
        summary: >-
          The total the source states (an `eval.run-manifest/1`'s `tokens`), or, for a transcript
          or a driven run, the sum of input, output, cache read and cache write tokens when all
          four are known and the sum fits; otherwise absent. Thinking tokens are their own figure
          and are not part of it.
      - name: cost_micro_usd
        type: Optional<Integer>
        summary: >-
          What the task cost, in millionths of a US dollar, as the transcript
          (`RunOutcome::total_cost_usd`) or the run manifest (`cost_micro_usd`) states it.
      - name: wall_time_ms
        type: Optional<Integer>
        summary: >-
          Wall-clock duration in milliseconds (`RunOutcome::duration_ms`, the manifest's
          `wall_time_ms`).
      - name: llm_steps_declared
        type: Optional<Integer>
        summary: For a driven run, how many llm steps its step map declares; absent for any other source.
      - name: llm_steps_run
        type: Optional<Integer>
        summary: For a driven run, how many llm steps it ran; absent for any other source.
    lifecycle:
      # An evidence file is never edited or deleted (AGENTS.md *Planning store*, rule 2).
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

actors:
  # Whoever runs `aep` in the repository; the CLI knows no caller beyond the process.
  - name: aep.evidence.Operator
    may:
      - aep.evidence.RecordFromReport
      - aep.evidence.RecordSpend

errors:
  # change (story:evidence-admits-ordinary-ess-suites): on 0.71.0 an ordinary major from /6 on was
  # sent to the coverage reader and refused as `MissingField at $suite.coverage`. Every refusal of
  # aep.evidence.RecordFromReport writes nothing.
  - name: aep.evidence.UnsupportedSuiteVersion
    summary: >-
      The suite's `provenance.suite_version` or the report's `suite.version` is a major this build
      does not know; the refusal is `UnsupportedSuiteVersion` and names the version (story
      acceptance 3), never a missing field.
    fields: []
  - name: aep.evidence.SuiteVersionMismatch
    summary: >-
      The report's `suite.version` differs from the suite's `provenance.suite_version`
      (`SuiteVersionMismatch`, counts.rs `admit_suite`; story acceptance 2).
    fields: []
  - name: aep.evidence.SuiteDigestMismatch
    summary: >-
      The SHA-256 of the suite's original bytes differs from the report's `suite.digest`
      (`SuiteDigestMismatch`, counts.rs `admit_suite`; story acceptance 2).
    fields: []
  # change (story:evidence-admits-generated-runner-profile): on 0.71.1 `go-scenario-status/2`
  # was refused here.
  - name: aep.evidence.UnsupportedProducerProfile
    summary: >-
      The report's `producer_profile` is a spelling this build does not list
      (`UnsupportedProducerProfile at $.producer_profile`, counts.rs and coverage.rs
      `read_report`), e.g. `go-scenario-status/3`.
    fields: []
  - name: aep.evidence.ProfileOutcomeMismatch
    summary: >-
      The report counts a category its producer profile cannot emit: skipped under
      `rust-scenario-status/1` or `external-scenario-status/1`, error or unsupported under
      `go-scenario-status/1` (`ProfileOutcomeMismatch`, ess_conformance_v2.rs `profile_status`
      and ess_conformance_coverage.rs `execution_status`).
    fields: []
  - name: aep.evidence.ExecutionStatusMismatch
    summary: >-
      The report's `execution_status` is not the one its counts imply under its producer profile
      (`ExecutionStatusMismatch at $.execution_status`).
    fields: []
  # change (story:evidence-records-relative-inputs): the rule a record's input names keep. On
  # 0.71.2 the record kept the path as typed, so a record made with an absolute path carried the
  # operator's local directories, which mean nothing on another machine and which Gates'
  # personal-paths scan refuses.
  - name: aep.evidence.InputPathNotPortable
    summary: >-
      An input would be named neither by its path relative to the repository root nor, outside
      the root, by its file name alone: an absolute path or a parent component would reach the
      record (`InputPathNotPortable`, planning.rs `recorded_input`). Nothing is written.
    fields: []
  # change (story:task-spend-is-modelled): a spend record without its source's digest could not be
  # tied to the bytes its figures were read from.
  - name: aep.evidence.SpendSourceDigestMissing
    summary: >-
      A spend record names no source digest. Nothing is written.
    fields: []
  # change (story:evidence-records-task-spend): a spend source outside the repository root would
  # be named by an absolute local path or by a bare file name nobody could find again.
  - name: aep.evidence.SpendSourceOutsideRepository
    summary: >-
      The source lies outside the repository root once every link in its path and in the root's
      is resolved, a directory link out of the repository and a `..` after one included
      (`SpendSourceOutsideRepository`, planning/recorded_input.rs `repository_relative`); the
      refusal names the path as given. Nothing is written.
    fields: []
  # change (story:evidence-records-task-spend): a file no spend reader recognises, or one stating
  # a figure no reader can convert, would otherwise be recorded as a spend of unknown figures:
  # unreadable is not unstated.
  - name: aep.evidence.SpendSourceUnreadable
    summary: >-
      The source is no `eval.run-manifest/1`, driven run cursor or transcript a reader
      recognises (a transcript with no terminal record and no request), or a terminal record's
      `total_cost_usd` is neither a number nor `null` (`SpendSourceUnreadable`,
      planning/task_spend.rs `read_spend`); the refusal names the file. Nothing is written.
    fields: []

events:
  # aep publishes no events. This is the fact the success outcome produces, declared because ESS
  # requires one per outcome that changes a record; no component publishes it.
  - name: aep.evidence.ConformanceRecorded
    fields:
      - name: record
        type: aep.evidence.RecordName
      - name: artifact
        type: aep.evidence.ArtifactId
      - name: suite_version
        type: String
  # change (story:task-spend-is-modelled): the fact aep.evidence.RecordSpend produces; no
  # component publishes it.
  - name: aep.evidence.SpendRecorded
    fields:
      - name: record
        type: aep.evidence.RecordName
      - name: artifact
        type: aep.evidence.ArtifactId
      - name: source
        type: aep.evidence.SpendSource

commands:
  # `aep plan artifact evidence <id> --from <report> --suite <suite>` with an
  # `ess-conformance-report/2` (planning.rs `record_evidence`, `recorded_from_report` and
  # `coverage_input_from_raw_suite`, which asks `suite_route` in aep-ess-evidence `route.rs`).
  #
  # change (story:evidence-admits-ordinary-ess-suites): the suite is routed by what it is. On
  # 0.71.0 every major from /5 on went to the coverage reader (`major >= 5`).
  - name: aep.evidence.RecordFromReport
    naming:
      wire: artifact-evidence-from-report
      display: aep plan artifact evidence --from --suite
      summary: Record a report/2 against the exact suite it ran, bound by version and digest.
    input:
      - name: id
        type: aep.evidence.ArtifactId
      # ESS-LIMIT: the record's name is made by the CLI from the artifact, the kind and the
      # clock (planning.rs `evidence_through_a_command`), and a created row's identity in ESS
      # 0.56.0 is an input field, so it is declared as one. Pinned by
      # `an_ordinary_suite_ess_wrote_is_recorded_with_its_report` (aep-cli tests).
      - name: record
        type: aep.evidence.RecordName
      - name: suite_version
        type: String
        summary: The suite's `provenance.suite_version`, as written.
      - name: report_suite_version
        type: String
        summary: The report's `suite.version`, as written.
      # ESS-LIMIT: what a suite major is comes from two lists the build holds
      # (`ORDINARY_SUITE_MAJORS`, `COVERAGE_SUITE_MAJORS`), and ESS 0.56.0 has no operator that
      # reads the number in `ess-conformance/<N>` (`suite_version any_of [...]` is refused as
      # `unparsable_predicate`, ESS-SPEC-012). Spelling every version as its own comparison would
      # copy both lists here, where nothing checks them against the readers; the lists stay in
      # Rust, and the command takes each version's kind as an input. Pinned by the
      # aep-ess-evidence `suite_route` tests and
      # `count_suite_reference_admits_the_frozen_and_ordinary_majors_and_names_any_other`
      # (aep-domain `ess_coverage_values`).
      - name: suite_kind
        type: aep.evidence.SuiteKind
      - name: report_suite_kind
        type: aep.evidence.SuiteKind
      # ESS-LIMIT: whether the suite's original bytes hash to the report's `suite.digest` is a
      # SHA-256 over a file, and ESS 0.56.0 has no digest operator, so the command takes the
      # answer as a Boolean. Pinned by
      # `an_ordinary_suite_whose_bytes_differ_from_the_report_digest_is_refused` (aep-ess-evidence
      # `ordinary_suites`) and its aep-cli counterpart.
      - name: suite_digest_matches
        type: Boolean
      # ESS-LIMIT: the report's `producer_profile` is a closed spelling, one with an open runner
      # suffix (`external-scenario-status/1;runner=<name>@<version>`), and ESS 0.57.0 has no
      # operator over the parts of a String, so the command takes the spelling's kind. The
      # spellings stay in Rust (`ProducerProfile::from_wire`). Pinned by
      # `a_generated_runner_report_is_admitted_by_the_count_stage_reader`,
      # `unknown_producer_profiles_stay_refused` (aep-ess-evidence `generated_runner_profile`) and
      # `count_stage_external_profiles_record_exactly_and_near_misses_refuse` (`counts`).
      - name: producer_profile
        type: aep.evidence.ProducerProfile
      - name: execution_status
        type: aep.evidence.ExecutionStatus
        summary: The report's `execution_status`, as written.
      # The report's `counts.<category>`; a count's range (unsigned 64-bit decimal) and its
      # agreement with `total` and the outcome lists are checked by the readers, not modelled.
      - name: failed
        type: Integer
      - name: error
        type: Integer
      - name: unsupported
        type: Integer
      - name: skipped
        type: Integer
      # change (story:evidence-records-relative-inputs): how the report and the suite are named.
      # ESS-LIMIT: which form a path takes is decided by comparing its components with the
      # repository root's, and ESS 0.59.0 has no operator over the parts of a String or a path,
      # so the command takes each input's form. The decision stays in Rust (planning.rs
      # `recorded_input`). Pinned by
      # `a_count_stage_report_2_inside_the_repository_is_recorded_relative_to_its_root_with_digests`,
      # `a_coverage_report_2_inside_the_repository_is_recorded_relative_to_its_root_with_digests`,
      # `a_report_1_inside_the_repository_is_recorded_relative_to_its_root_with_its_digest`,
      # `an_input_outside_the_repository_is_recorded_by_file_name_and_digest` (aep-cli
      # `evidence_relative_inputs`) and the `recorded_input` unit tests (aep-cli planning).
      - name: report_input_form
        type: aep.evidence.InputForm
      - name: suite_input_form
        type: aep.evidence.InputForm
      - name: report_input
        type: String
      - name: suite_input
        type: String
      # ESS-LIMIT: a digest is a SHA-256 over a file, and ESS 0.59.0 has no digest operator, so
      # the command takes each digest as written.
      - name: report_input_digest
        type: aep.evidence.InputDigest
      - name: suite_input_digest
        type: aep.evidence.InputDigest
      - name: reference
        type: String
        summary: "`report_input`@`report_input_digest`, as aep.evidence.ConformanceRecord says."
    outcomes:
      # change (story:evidence-admits-generated-runner-profile): both readers read the profile
      # before the report's suite version, and after the route has refused an unknown suite.
      - name: unsupported-producer-profile
        when:
          all:
            - suite_kind != "unknown"
            - producer_profile == "unknown"
        error: aep.evidence.UnsupportedProducerProfile
      # A version this build does not know is refused by name before any reader interprets the
      # suite: the route refuses the suite's own version, and the reader it chose the report's.
      # The count reader also refuses a report naming a coverage major as a version it does not
      # read (counts.rs `read_report`, `SuiteReference::new`), before comparing the two versions.
      - name: unsupported-suite-version
        when:
          any:
            - suite_kind == "unknown"
            - report_suite_kind == "unknown"
            - all:
                - suite_kind != "coverage"
                - report_suite_kind == "coverage"
        error: aep.evidence.UnsupportedSuiteVersion
      # Both readers check the counts against the profile before the suite is paired with the
      # report, so these two precede the coverage route. `go-scenario-status/1` keeps its
      # restriction; `go-scenario-status/2` may count every category.
      - name: profile-outcome-mismatch
        when:
          any:
            - all:
                - producer_profile == "go_scenario_status_1"
                - any:
                    - error > 0
                    - unsupported > 0
            - all:
                - any:
                    - producer_profile == "rust_scenario_status_1"
                    - producer_profile == "external_scenario_status_1"
                - skipped > 0
        error: aep.evidence.ProfileOutcomeMismatch
      # The execution rule, past the category restrictions above: failed when any scenario failed
      # or was unsupported; otherwise inconclusive when any errored or was skipped; otherwise
      # passed. Under `go-scenario-status/2` all four categories can be nonzero (ESS 0.57.0
      # `formats.md`, "Generated Go and TypeScript count reports"); under the other profiles the
      # categories they cannot emit are zero here, so the same rule is each profile's own.
      - name: execution-status-mismatch
        when:
          any:
            - all:
                - any:
                    - failed > 0
                    - unsupported > 0
                - execution_status != "failed"
            - all:
                - failed == 0
                - unsupported == 0
                - any:
                    - error > 0
                    - skipped > 0
                - execution_status != "inconclusive"
            - all:
                - failed == 0
                - unsupported == 0
                - error == 0
                - skipped == 0
                - execution_status != "passed"
        error: aep.evidence.ExecutionStatusMismatch
      # A coverage suite goes to the coverage reader, as on 0.71.0, outside this specification.
      - name: coverage-suite
        when: suite_kind == "coverage"
        accepts: nothing
      - name: suite-version-mismatch
        when: report_suite_version != suite_version
        error: aep.evidence.SuiteVersionMismatch
      - name: suite-digest-mismatch
        when: suite_digest_matches == false
        error: aep.evidence.SuiteDigestMismatch
      # change (story:evidence-records-relative-inputs): an input is named after both readers
      # have admitted the pair, as the record's source is built, and a name that is neither form
      # is refused rather than written.
      - name: input-path-not-portable
        when:
          any:
            - report_input_form == "as_typed"
            - suite_input_form == "as_typed"
        error: aep.evidence.InputPathNotPortable
      # change: an ordinary suite is recorded the way a count-stage one is, as one
      # `ess_conformance_v2` record whose source carries the report's counts and statuses, at the
      # report's `completed_at` (`{generated: true}`: the host reads it from the report).
      - name: recorded
        creates: aep.evidence.ConformanceRecord
        instance: record
        sets:
          artifact: input.id
          suite_version: input.suite_version
          suite_kind: input.suite_kind
          producer_profile: input.producer_profile
          execution_status: input.execution_status
          completed_at: {generated: true}
          report_input: input.report_input
          report_input_digest: input.report_input_digest
          suite_input: input.suite_input
          suite_input_digest: input.suite_input_digest
          reference: input.reference
        emits: [aep.evidence.ConformanceRecorded]
        payload:
          aep.evidence.ConformanceRecorded:
            record: input.record
            artifact: input.id
            suite_version: input.suite_version

  # change (story:task-spend-is-modelled): records one source's spend against one artifact. The
  # CLI verb, the evidence kind and how each source is read into the figures are
  # story:evidence-records-task-spend; until it lands nothing invokes this command.
  - name: aep.evidence.RecordSpend
    naming:
      wire: artifact-evidence-spend
      display: aep plan artifact evidence --kind task_spend
      summary: Record what one source says one task spent, each unstated figure absent.
    input:
      - name: id
        type: aep.evidence.ArtifactId
      # ESS-LIMIT: as on aep.evidence.RecordFromReport, the record's name is made by the CLI from
      # the artifact, the kind and the clock, and a created row's identity is an input field.
      - name: record
        type: aep.evidence.RecordName
      - name: source
        type: aep.evidence.SpendSource
      # ESS-LIMIT: the digest is a SHA-256 over the source's bytes, and ESS 0.59.0 has no digest
      # operator, so the command takes it as written; optional here so that a record naming none
      # is declared and refused, not left unrepresentable.
      - name: source_digest
        type: Optional<aep.evidence.InputDigest>
      # change (story:evidence-records-task-spend): how the source is named.
      # ESS-LIMIT: as on aep.evidence.RecordFromReport, which form a path takes is decided by
      # comparing its components with the repository root's, after resolving links in both, and
      # ESS 0.59.0 has no operator over the parts of a path or the filesystem, so the command
      # takes the form. The decision is planning/recorded_input.rs `repository_relative`'s.
      # Pinned by `a_spend_source_outside_the_repository_is_refused_naming_it`,
      # `a_source_reached_through_a_link_to_outside_the_repository_is_refused` and
      # `a_dot_dot_after_a_link_names_the_file_the_record_read` (aep-cli `evidence_task_spend`
      # and `evidence_task_spend_adversary`).
      - name: source_input_form
        type: aep.evidence.InputForm
      - name: source_input
        type: String
      # change (story:evidence-records-task-spend): whether a reader recognises the source and
      # can convert every figure it states.
      # ESS-LIMIT: recognising a transcript, a manifest or a cursor is parsing a file, and
      # ESS 0.59.0 has no operator over a file's bytes, so the command takes the answer as a
      # Boolean. The decision is planning/task_spend.rs `figures_of`'s. Pinned by
      # `a_cost_written_as_text_is_refused_not_recorded_unknown` and
      # `a_json_file_that_is_no_spend_source_is_refused` (aep-cli `evidence_task_spend_adversary`).
      - name: source_readable
        type: Boolean
      - name: model_calls
        type: Optional<Integer>
      - name: input_tokens
        type: Optional<Integer>
      - name: output_tokens
        type: Optional<Integer>
      - name: cache_read_tokens
        type: Optional<Integer>
      - name: cache_write_tokens
        type: Optional<Integer>
      - name: thinking_tokens
        type: Optional<Integer>
      # change (story:evidence-records-task-spend): new.
      # ESS-LIMIT: the total is read from the manifest or summed from the four split figures
      # other than thinking tokens, and ESS 0.59.0 has no arithmetic over Optional inputs, so the
      # command takes the total as read. The rule is `SpendFigures::with_split_total` (aep-domain
      # evidence.rs), pinned by its unit tests and by the aep-cli `evidence_task_spend` tests and
      # `a_transcript_total_equals_the_total_its_run_manifest_states`.
      - name: total_tokens
        type: Optional<Integer>
      - name: cost_micro_usd
        type: Optional<Integer>
      - name: wall_time_ms
        type: Optional<Integer>
      - name: llm_steps_declared
        type: Optional<Integer>
      - name: llm_steps_run
        type: Optional<Integer>
    outcomes:
      # change (story:evidence-records-task-spend): the source is named before it is read, so a
      # source outside the root is refused whatever it holds.
      - name: source-outside-repository
        when: source_input_form != "repository_relative"
        error: aep.evidence.SpendSourceOutsideRepository
      # change (story:evidence-records-task-spend): `--kind task_spend` with no `--from` names no
      # file, so no digest (planning.rs `record_evidence`). Pinned by
      # `task_spend_without_a_source_file_is_refused_and_writes_nothing`.
      - name: source-digest-missing
        when: missing(source_digest)
        error: aep.evidence.SpendSourceDigestMissing
      # change (story:evidence-records-task-spend): unreadable is not unstated.
      - name: source-unreadable
        when: source_readable == false
        error: aep.evidence.SpendSourceUnreadable
      # An absent figure is written absent: each `sets:` entry reads an Optional input, so the
      # record never gains a zero the source did not state.
      - name: recorded
        creates: aep.evidence.SpendRecord
        instance: record
        sets:
          artifact: input.id
          source: input.source
          source_digest: input.source_digest
          source_input: input.source_input
          model_calls: input.model_calls
          input_tokens: input.input_tokens
          output_tokens: input.output_tokens
          cache_read_tokens: input.cache_read_tokens
          cache_write_tokens: input.cache_write_tokens
          thinking_tokens: input.thinking_tokens
          total_tokens: input.total_tokens
          cost_micro_usd: input.cost_micro_usd
          wall_time_ms: input.wall_time_ms
          llm_steps_declared: input.llm_steps_declared
          llm_steps_run: input.llm_steps_run
        emits: [aep.evidence.SpendRecorded]
        payload:
          aep.evidence.SpendRecorded:
            record: input.record
            artifact: input.id
            source: input.source


domain: aep.drive

summary: >-
  The steps of a step map as the map loader admits them: each step's kind, the format version of
  the map it belongs to, and the `judgement:` line an `llm` step carries to say what no command
  could decide, required by an `aep.driver-steps/2` map and refused there by a stable code at the
  step's path when absent, optional in an `aep.driver-steps/1` map (every protocol tree before
  0.72.0 is one, and a pinned tree can never gain the key); and the counts a driven run keeps of its map's
  `llm` steps, declared and run, which `aep drive run`, `aep drive resume` and
  `aep drive status --run <run>` print and the run's report carries. Declared for
  story:llm-step-declares-judgement. A `command` step's `expect:`, which inverts the verdict its
  exit status carries, and its `output:` file; the named inputs a run is given
  (`aep drive run --input <name>=<value>`) and every `{input.<name>}` a step names, refused before
  any step runs when the run was not given it. Declared for story:command-step-expects-failure.

# Paths are relative to the repository root. `map.rs` and `cursor.rs` are under
# crates/drive/aep-driver-spec/src/, `run.rs` is crates/drive/aep-driver/src/run.rs and `drive.rs`
# is crates/edge/aep-cli/src/drive.rs, unless a path says otherwise. Functions are named rather
# than lines, because the change moves them.
#
# Not modelled here: the rest of a step map (its workflow pin, a format string other than the two
# this build reads, which `StepMap::try_from` refuses with `unsupported_format_version` before
# any step is admitted, visit budgets, the `command` step's evidence mapping, circuit breaker and
# placeholders other than `{input.<name>}`, the `llm` step's scope, skills and harness, the
# `operator` step's prompt), the two-phase cross-validation against the workflow and the protocol
# (`StepMap::cross_validate`, `StepMap::check_run`), and every other fact of a run's cursor (state,
# visits, attempts per step, in-flight attempt, owed answers). Each is unchanged by these stories.

types:
  # read from: a step map's `id`, such as `development/default` (map.rs `StepMapId`).
  - name: aep.drive.StepMapId
    kind: newtype
    of: String

  # read from: where a step sits in its map, as every refusal of it names it:
  # `driver-steps[<map>].states.<state>.steps[<index>]` (map.rs `StepMap::try_from`, the
  # `location` it hands `validate_step`).
  - name: aep.drive.StepPath
    kind: newtype
    of: String

  # read from: a run's id, `<task>/<n>` such as `AUTH-142/3` (cursor.rs `RunId`).
  - name: aep.drive.RunId
    kind: newtype
    of: String

  # read from: a step map's `format:` (map.rs `StepMapFormat`, read by `StepMap::try_from`).
  # `v1` is `aep.driver-steps/1`, `v2` is `aep.driver-steps/2`; any other string is refused
  # before a step is admitted (`unsupported_format_version`), so it never reaches a step.
  # change (release 0.72.1): new. 0.72.0 read only `/1` and applied the judgement rule to it,
  # which refused every map of every protocol tree a store pinned before 0.72.0.
  - name: aep.drive.StepMapFormat
    kind: enum
    variants:
      - v1  # `aep.driver-steps/1`: an llm step's judgement is optional
      - v2  # `aep.driver-steps/2`: every llm step carries a judgement

  # read from: a step's `kind:` (map.rs `RawStep`, `StepKind`).
  - name: aep.drive.StepKind
    kind: enum
    variants:
      - command   # runs a program and maps its result to evidence
      - llm       # asks a model, with a tool set the protocol derived
      - operator  # stops and hands the run to a person

  # change (story:command-step-expects-failure): read from a `command` step's `expect:` (map.rs
  # `RawCommandStep::expect`, `Expect`). Absent is `success`, which is every map written before.
  - name: aep.drive.Expectation
    kind: enum
    variants:
      - success  # exit 0 is a passing verdict, any other exit a failing one
      - failure  # any exit but 0 is a passing verdict, and exit 0 a failing one: nothing reproduced

  # change (story:command-step-expects-failure): the name of a run input, as
  # `aep drive run --input <name>=<value>` gives it and `{input.<name>}` names it (map.rs
  # `placeholders_in`, drive.rs `parse_input`): a lowercase letter, then lowercase letters,
  # digits, `_` and `-`.
  - name: aep.drive.InputName
    kind: newtype
    of: String

  # change (story:command-step-expects-failure): one `--input <name>=<value>` (drive.rs
  # `RunArgs::input`, `Launch::inputs`, run.rs `DriverOptions::inputs`).
  - name: aep.drive.RunInput
    kind: struct
    fields:
      - name: name
        type: aep.drive.InputName
      - name: value
        type: String

entities:
  # One step of a step map, as the loader admitted it (map.rs `Step`). A step map is a document in
  # the repository; nothing writes one through `aep`.
  - name: aep.drive.Step
    naming:
      summary: One validated step of an aep.driver-steps/1 or aep.driver-steps/2 map.
    identity:
      name: path
      type: aep.drive.StepPath
    fields:
      - name: map
        type: aep.drive.StepMapId
        summary: The map the step belongs to.
      # change (release 0.72.1): new. The format version of the map the step belongs to
      # (map.rs `StepMap::format`), which decides whether its judgement is required.
      - name: format
        type: aep.drive.StepMapFormat
        summary: The format version of the map the step belongs to.
      - name: kind
        type: aep.drive.StepKind
        summary: What sort of step it is.
      # change (story:llm-step-declares-judgement): new on an `llm` step (map.rs `RawLlmStep`,
      # `LlmStep::judgement`). On 0.71.3 an `llm` step had `prompt, context, scope, skills,
      # harness, description`, and none of them said why a model was needed.
      # change (release 0.72.1): optional again in a `v1` map.
      - name: judgement
        type: Optional<String>
        summary: >-
          What this step decides that no command could, in one line. Present on every `llm`
          step of a `v2` map, and on an `llm` step of a `v1` map when its author wrote one; a
          `command` or `operator` step has no such key (`deny_unknown_fields` refuses it).
      # change (story:command-step-expects-failure): new on a `command` step (map.rs
      # `RawCommandStep::expect`, `CommandStep::expect`, `CommandStep::verdict`).
      - name: expect
        type: aep.drive.Expectation
        summary: >-
          Which exit status is the passing verdict. A step that does not write the key holds
          `success`, and behaves, and digests, exactly as before the key existed. Every `llm` and
          `operator` step holds `success`: neither has the key (`deny_unknown_fields` refuses it,
          as for `judgement` on a `command` step).
      # change (story:command-step-expects-failure): new on a `command` step (map.rs
      # `RawCommandStep::output`, drive.rs `run_command`).
      - name: output
        type: Optional<String>
        summary: >-
          A file name in the run directory the step's standard output is written to, so a later
          step names it as `{run_directory}/<file>`. An `llm` or `operator` step has no such key.
      # change (story:command-step-expects-failure): every `{input.<name>}` the step's `run`
      # words, its evidence `record:` path or its `context` entries name (map.rs
      # `Step::inputs_named`).
      - name: inputs_named
        type: List<aep.drive.InputName>
        summary: The run inputs the step names, each once, in the order it names them.
    invariants:
      # Every `llm` step of a `v2` map the loader admits carries its judgement (the
      # `judgement-missing` outcome). A `v1` map adopted no such rule.
      - any:
          - kind != "llm"
          - format == "v1"
          - defined(judgement)
    lifecycle:
      # A loaded map is immutable: a run pins its digest (cursor.rs `DriverCursor::map_digest`).
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # One driven run, as its cursor records it (cursor.rs `DriverCursor`): only the two counts this
  # story adds.
  - name: aep.drive.Run
    naming:
      summary: A driven run and the counts it keeps of its map's llm steps.
    identity:
      name: run
      type: aep.drive.RunId
    fields:
      - name: map
        type: aep.drive.StepMapId
        summary: The step map driving the run (`DriverCursor::map`).
      # change (story:llm-step-declares-judgement): new in the cursor
      # (`DriverCursor::llm_steps_declared`, written by run.rs `sync_llm_counts`).
      - name: llm_steps_declared
        type: Integer
        summary: >-
          How many `llm` steps the map declares, over every state (map.rs
          `StepMap::llm_steps_declared`).
      # change (story:llm-step-declares-judgement): new in the cursor
      # (`DriverCursor::llm_steps_run`, counted by run.rs `Session::begin_attempt` and filled in
      # for an older cursor by `sync_llm_counts`).
      - name: llm_steps_run
        type: Integer
        summary: >-
          How many `llm` step attempts the run has begun, over its whole life, resumes included:
          one per `aep.drive.RunLlmStep`. A step retried once is two, as `steps run` counts it,
          and an unresolved attempt retried with `--retry-in-flight` is a second attempt although
          it keeps its attempt number. A cursor written before the count existed starts from the
          sum of its `attempts` at every `llm` step of the map.
      # change (story:command-step-expects-failure): new in the run's launch record
      # (drive.rs `Launch::inputs`, handed to run.rs as `DriverOptions::inputs`), so a resume
      # expands the values the run was started with.
      - name: inputs
        type: List<aep.drive.RunInput>
        summary: >-
          The `--input <name>=<value>` pairs the run was started with, by name; a resume reads
          them back rather than taking new ones.
    lifecycle:
      # The run's status (running, completed, blocked, …) is not modelled here.
      initial: Started
      states: [Started]
      terminal: [Started]

actors:
  # Whoever runs `aep` in the repository; the CLI knows no caller beyond the process.
  - name: aep.drive.Operator
    may:
      - aep.drive.DeclareStep
      - aep.drive.DeclareOutput
      - aep.drive.StartRun
      - aep.drive.RunLlmStep
      - aep.drive.ReadCommandExit
      - aep.drive.ShowStatus

errors:
  # change (story:llm-step-declares-judgement): both new. A map with a refused step does not load,
  # and every refusal of the map accumulates with the others (AGENTS.md invariant
  # *Validation accumulates*).
  - name: aep.drive.JudgementMissing
    summary: >-
      An `llm` step of an `aep.driver-steps/2` map without a `judgement:` key. The refusal's code is `missing_declaration` and
      its path is the step's, `driver-steps[<map>].states.<state>.steps[<index>].judgement`
      (map.rs `validate_step`; story acceptance 1).
    fields: []
  - name: aep.drive.JudgementBlank
    summary: >-
      An `llm` step whose `judgement:` is empty or whitespace only, in a map of either format
      version. The refusal's code is `empty_declaration` at the same path (map.rs
      `validate_step`).
    fields: []
  # change (story:command-step-expects-failure): the four below are new.
  - name: aep.drive.ExpectationReadsRecord
    summary: >-
      A `command` step with `expect: failure` whose evidence names `record:`. The verdict is then
      the document the verifier wrote and no exit status is read, so there is nothing to invert.
      The refusal's code is `unsupported_construct` at `<step>.expect` (map.rs `validate_step`).
    fields: []
  - name: aep.drive.OutputNotAFileName
    summary: >-
      A `command` step whose `output:` is blank, holds a path separator, starts with `.`, or is a
      name the run directory already uses for its own records (map.rs
      `CommandStep::RESERVED_OUTPUTS`). The refusal's code is `empty_declaration` for a blank one
      and `unsupported_construct` otherwise, at `<step>.output` (map.rs `validated_output`).
    fields: []
  - name: aep.drive.InputMissing
    summary: >-
      A step names `{input.<name>}` and the run was not given `--input <name>=<value>`. Refused
      before a run id is allocated and again before the driver runs any step, with code
      `undeclared_reference` at the step's path and a message naming the placeholder (map.rs
      `StepMap::check_inputs`, drive.rs `start_with_host`, run.rs `Session::check_map`).
    fields: []
  - name: aep.drive.NoVerdict
    summary: >-
      The command was killed by a signal and has no exit status. Whatever the step expects, a
      process that did not finish observed nothing, and nothing is submitted (D5's `Unknown`;
      drive.rs `run_command`).
    fields: []
  - name: aep.drive.RunNotFound
    summary: >-
      `--run` names a run with no cursor in the store's runs directory (drive.rs `status`,
      `RunDirectory::read_cursor`).
    fields:
      - name: run
        type: aep.drive.RunId

events:
  # aep publishes no events. These are the facts the changing outcomes produce, declared because
  # ESS requires one per outcome that changes a record; no component publishes them.
  - name: aep.drive.StepDeclared
    fields:
      - name: path
        type: aep.drive.StepPath
      - name: kind
        type: aep.drive.StepKind
  - name: aep.drive.RunStarted
    fields:
      - name: run
        type: aep.drive.RunId
      - name: llm_steps_declared
        type: Integer
  - name: aep.drive.LlmStepBegun
    fields:
      - name: run
        type: aep.drive.RunId

commands:
  # Loading one step of a step map (map.rs `StepMap::try_from` and `validate_step`), as every
  # `aep drive` verb that reads a map does before anything runs.
  #
  # change (story:llm-step-declares-judgement): an `llm` step is refused without a judgement.
  # change (release 0.72.1): only in a `v2` map. A `v1` map loads as it did in 0.71.x: its `llm`
  # step may omit the judgement, and one it writes must not be blank.
  - name: aep.drive.DeclareStep
    naming:
      wire: driver-steps-load-step
      display: aep drive run --map
      summary: Admit one step of a step map, refusing an llm step of a v2 map that says no judgement.
    input:
      - name: path
        type: aep.drive.StepPath
      - name: map
        type: aep.drive.StepMapId
      - name: format
        type: aep.drive.StepMapFormat
      - name: kind
        type: aep.drive.StepKind
      - name: judgement
        type: Optional<String>
      # change (story:command-step-expects-failure): the four inputs below are new.
      # The step's `expect:`, read as `success` when the document does not write it (map.rs
      # `CommandStep::expect`). Every `llm` and `operator` step is `success`: writing the key on
      # one does not parse, so no outcome here receives it.
      - name: expect
        type: aep.drive.Expectation
      # Checked on its own by aep.drive.DeclareOutput before the step is admitted.
      - name: output
        type: Optional<String>
      # Whether the step's evidence names `record:` (map.rs `EvidenceMapping::record`).
      - name: reads_record
        type: Boolean
      - name: inputs_named
        type: List<aep.drive.InputName>
    outcomes:
      - name: judgement-missing
        when:
          all:
            - kind == "llm"
            - format == "v2"
            - not defined(judgement)
        error: aep.drive.JudgementMissing
      # change (story:command-step-expects-failure): new.
      - name: expected-failure-reads-a-record
        when:
          all:
            - expect == failure
            - reads_record
        error: aep.drive.ExpectationReadsRecord
      # An `llm` step whose judgement is written and empty, in a map of either format version.
      # ESS-LIMIT: a judgement of only whitespace is refused too, and ESS 0.59.0 has no predicate
      # for it (no trimmed form of a String, as at aep.review.RecordReview `prose-only-blank`), so
      # `declared` below admits one. Pinned by
      # `an_llm_step_with_a_blank_judgement_is_refused_at_its_path` and
      # `a_v1_llm_step_with_a_blank_judgement_is_still_refused` (aep-driver-spec map tests).
      - name: judgement-blank
        when:
          all:
            - kind == "llm"
            # An absent judgement leaves its byte length unknown, which selects nothing.
            - judgement.utf8_bytes == 0
        error: aep.drive.JudgementBlank
      # What is left: a `command` or `operator` step, an `llm` step with a judgement, and an `llm`
      # step of a `v1` map without one.
      - name: declared
        creates: aep.drive.Step
        instance: path
        sets:
          map: input.map
          format: input.format
          kind: input.kind
          judgement: input.judgement
          expect: input.expect
          output: input.output
          inputs_named: input.inputs_named
        emits: [aep.drive.StepDeclared]
        payload:
          aep.drive.StepDeclared:
            path: input.path
            kind: input.kind


  # change (story:command-step-expects-failure): new. The loader checking a `command` step's
  # `output:` when it writes one (map.rs `validated_output`, called from `validate_step` with the
  # step's other checks, so a bad output accumulates with every other refusal of the map).
  #
  # ESS-LIMIT: its own command rather than a refusal of aep.drive.DeclareStep, because a guard
  # over an absent `Optional<String>` is unknown in ESS 0.59.0 and the default `judgement-blank`
  # branch there could then not be decided; here the text is present by construction. An output of
  # only whitespace is refused too, and ESS 0.59.0 has no trimmed form of a String (as at
  # `judgement-blank`), so `kept` admits one. Pinned by
  # `an_output_that_is_not_a_file_name_of_its_own_is_refused_at_its_path` (aep-driver-spec map
  # tests).
  - name: aep.drive.DeclareOutput
    naming:
      wire: driver-steps-load-output
      display: aep drive run --map
      summary: Admit a command step's output file name, refusing one that is not a name of its own.
    input:
      - name: path
        type: aep.drive.StepPath
      - name: output
        type: String
    outcomes:
      - name: not-a-file-name
        when:
          any:
            - output.utf8_bytes == 0
            - output: {contains: "/"}
            - output: {contains: "\\"}
            - output: {starts_with: "."}
            - output:
                any_of:
                  - cursor.json
                  - cursor.writing
                  - snapshot.json
                  - snapshot.writing
                  - state.json
                  - state.writing
                  - launch.json
                  - launch.json.next
                  - commands.jsonl
                  - generations
                  - transcripts
        error: aep.drive.OutputNotAFileName
      - name: kept
        preserves: aep.drive.Step
        instance: path

  # `aep drive run` allocating a run (run.rs `fresh_cursor`, then `sync_llm_counts`).
  - name: aep.drive.StartRun
    naming:
      wire: drive-run-start
      display: aep drive run
      summary: Start a run, recording how many llm steps its map declares.
    input:
      - name: run
        type: aep.drive.RunId
      - name: map
        type: aep.drive.StepMapId
      # ESS-LIMIT: the count is over the map's steps (aep.drive.LlmStepsDeclared publishes it per
      # map), and ESS 0.59.0 has no value source that reads a view or counts related rows in
      # `sets:` (`{related:}` is refused, synthesize.md), so the command takes the count. Pinned
      # by `both_shipped_maps_validate_and_say_why_each_llm_step_needs_a_model` (aep-cli
      # flow tests) and `a_run_counts_the_llm_steps_its_map_declares_and_the_ones_it_ran`
      # (aep-driver driving).
      - name: llm_steps_declared
        type: Integer
      # change (story:command-step-expects-failure): the run's `--input` pairs, and the inputs its
      # map's steps name.
      - name: inputs
        type: List<aep.drive.RunInput>
      # ESS-LIMIT: the names are over the map's steps (aep.drive.Step `inputs_named`), and ESS
      # 0.59.0 reads no other entity's list in a command guard but through `when_related:`, whose
      # row-set form selects rows and cannot range over a field of each, so the command takes the
      # union. Pinned by `a_placeholder_naming_an_input_the_run_was_not_given_is_refused_before_any_step`
      # (aep-driver driving) and
      # `a_run_naming_an_input_it_was_not_given_is_refused_before_a_run_is_allocated` (aep-cli
      # drive_cli).
      - name: inputs_named
        type: List<aep.drive.InputName>
    outcomes:
      # change (story:command-step-expects-failure): new. A run names an input nobody gave it.
      - name: input-missing
        when:
          exists:
            in: inputs_named
            as: named
            that:
              not:
                exists:
                  in: inputs
                  as: given
                  that: given.name == named
        error: aep.drive.InputMissing
      - name: started
        creates: aep.drive.Run
        instance: run
        sets:
          map: input.map
          llm_steps_declared: input.llm_steps_declared
          llm_steps_run: 0
          inputs: input.inputs
        emits: [aep.drive.RunStarted]
        payload:
          aep.drive.RunStarted:
            run: input.run
            llm_steps_declared: input.llm_steps_declared

  # The driver beginning one attempt at an `llm` step (run.rs `Session::begin_attempt`, which
  # persists the cursor before the model is called), a `--retry-in-flight` retry included.
  - name: aep.drive.RunLlmStep
    naming:
      wire: drive-llm-step-begin
      display: aep drive run
      summary: Count one more llm step attempt against the run.
    input:
      - name: run
        type: aep.drive.RunId
    outcomes:
      - name: no-such-run
        unknown_instance: true
        error: aep.drive.RunNotFound
      - name: counted
        updates: aep.drive.Run
        instance: run
        sets:
          llm_steps_run: {increment: 1}
        emits: [aep.drive.LlmStepBegun]
        payload:
          aep.drive.LlmStepBegun:
            run: input.run

  # change (story:command-step-expects-failure): new. The driver reading a `command` step's exit
  # status against what the step expects (map.rs `CommandStep::verdict`, read by drive.rs
  # `run_command`), before it mints the step's evidence from the verdict. A step whose evidence
  # names `record:` reads no exit status and is not this command.
  #
  # ESS-LIMIT: the response cannot declare which value each outcome answers (ESS binds a value per
  # outcome only in an event payload, as at aep.drive.ShowStatus). `passed` is true in `passed`
  # and `reproduced` and false in `failed` and `nothing-reproduced`; `reason` is `nothing
  # reproduced` in `nothing-reproduced` and absent otherwise. Pinned by
  # `an_expected_failure_that_exits_nonzero_submits_passing_evidence`,
  # `an_expected_failure_that_exits_zero_submits_failing_evidence_saying_nothing_reproduced` and
  # `a_command_step_without_expect_reads_its_exit_status_as_before` (aep-cli drive tests).
  - name: aep.drive.ReadCommandExit
    naming:
      wire: drive-command-exit
      display: aep drive run
      summary: Read a command step's exit status as a verdict, inverted when it expects failure.
    input:
      - name: path
        type: aep.drive.StepPath
      # The step's own `expect:`, `success` when the step does not write it.
      - name: expect
        type: aep.drive.Expectation
      # Absent when a signal killed the process.
      - name: exit_code
        type: Optional<Integer>
    response:
      - name: passed
        type: Boolean
      - name: reason
        type: Optional<String>
    outcomes:
      - name: killed
        when: not defined(exit_code)
        error: aep.drive.NoVerdict
      - name: reproduced
        when:
          all:
            - expect == failure
            - exit_code != 0
        preserves: aep.drive.Step
        returns: true
        instance: path
      - name: nothing-reproduced
        when:
          all:
            - expect == failure
            - exit_code == 0
        preserves: aep.drive.Step
        returns: true
        instance: path
      - name: passed
        when: exit_code == 0
        preserves: aep.drive.Step
        returns: true
        instance: path
      - name: failed
        preserves: aep.drive.Step
        returns: true
        instance: path

  # `aep drive status --run <run>` (drive.rs `status`, `print_cursor`): prints
  # `llm steps  <declared> declared, <run> run`. `aep drive run` and `aep drive resume` print the
  # same line from the run's report (drive.rs `finish_with_command`, run.rs `RunReport`).
  # ESS-LIMIT: a response field cannot declare which row field answers it (ESS binds a value per
  # outcome only in an event payload); both are the run's own fields, and are pinned by
  # `status_prints_the_llm_steps_a_run_declared_and_ran` (aep-cli drive_cli).
  - name: aep.drive.ShowStatus
    naming:
      wire: drive-status
      display: aep drive status
      summary: Report a run, with the llm steps its map declares and the ones it ran.
    input:
      - name: run
        type: aep.drive.RunId
    response:
      - name: llm_steps_declared
        type: Integer
      - name: llm_steps_run
        type: Integer
    # A `--run` with no cursor is refused (drive.rs `status`, `RunDirectory::read_cursor`), and
    # ESS 0.59.0 admits `unknown_instance:` only beside a `moves:`, `updates:` or `deletes:`
    # branch (ESS-COMMAND-012), so this read declares no not-found answer.
    outcomes:
      - name: reported
        preserves: aep.drive.Run
        returns: true
        instance: run

views:
  # Structural: every invariant needs a view holding every state, and synthesis observes records
  # only through a view.
  - name: aep.drive.Steps
    source: aep.drive.Step
    consistency: read_your_writes
    fields:
      - name: path
        type: aep.drive.StepPath
      - name: state
        type: aep.drive.Step.State
      - name: map
        type: aep.drive.StepMapId
      - name: format
        type: aep.drive.StepMapFormat
      - name: kind
        type: aep.drive.StepKind
      - name: judgement
        type: Optional<String>
      - name: expect
        type: aep.drive.Expectation
      - name: output
        type: Optional<String>
      - name: inputs_named
        type: List<aep.drive.InputName>

  # change (story:llm-step-declares-judgement): the per-map count `aep drive` prints as
  # `llm steps  <n> declared` (map.rs `StepMap::llm_steps_declared`). Every step is grouped and
  # only the `llm` ones are counted, so a map whose steps are all commands answers 0.
  - name: aep.drive.LlmStepsDeclared
    source: aep.drive.Step
    consistency: read_your_writes
    group_by: [map]
    fields:
      - name: map
        type: aep.drive.StepMapId
      - name: llm_steps
        type: Integer
        aggregate: {count: {}, where: kind == "llm"}

  - name: aep.drive.Runs
    source: aep.drive.Run
    consistency: read_your_writes
    fields:
      - name: run
        type: aep.drive.RunId
      - name: state
        type: aep.drive.Run.State
      - name: map
        type: aep.drive.StepMapId
      - name: llm_steps_declared
        type: Integer
      - name: llm_steps_run
        type: Integer
      - name: inputs
        type: List<aep.drive.RunInput>

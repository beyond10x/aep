title: The plan renders itself, and a conformance report becomes evidence without being retyped
summary: AEP 0.43.0 lets a documentation site publish a plan without rebuilding it — `artifact board --format markdown` writes the page and `artifact graph --format mermaid` writes the diagram, with each column's blurb coming from `descriptions:` on its own ladder rather than a hard-coded map beside the renderer. `artifact evidence --from` reads an `ess-conformance-report/1` into the record it implies, taking the run's own instant rather than one the caller chose.

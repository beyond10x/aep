id: release.source
version: 1
title: Source release
summary: >-
  Qualify and verify source releases freely, while requiring a recorded human approval before any
  direct default-branch release housekeeping or immutable tag creation.
protocol: aop/1
workflow: release/source

# No `verify-after-action`: it asks for a service's health and its recovery, and a source release
# changes no running service. What verifies a source release is `verification.source-release`,
# which completion requires below.
principles:
  - provenance-tracking
  - contract-testing
  - approval-gates

capabilities:
  allow:
    - repository.read
    - tests.execute
    - artifact.read
    - approval.request
  require_approval:
    - repository.write

completion:
  all:
    - verification.source-release.passed
    - evidence.missing == 0

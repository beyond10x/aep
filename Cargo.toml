[workspace]
resolver = "2"
members = [
    "crates/govern/aep-domain",
    "crates/govern/aep-engine",
    "crates/plan/aep-contract",
    "crates/plan/aep-conformance",
    "crates/plan/aep-client",
    "crates/plan/aep-backend-entity",
    "crates/plan/aep-backend-eventlog",
    "crates/plan/aep-planning-migration",
    "crates/plan/aep-backend-hybrid",
    "crates/plan/aep-backend-markdown",
    "crates/plan/aep-backend-memory",
    "crates/plan/aep-backend-postgres",
    "crates/plan/aep-backend-sqlite",
    "crates/drive/aep-driver-spec",
    "crates/drive/aep-driver",
    "crates/drive/aep-render",
    "crates/observe/trace-domain",
    "crates/observe/trace-spec",
    "crates/observe/aep-ess-evidence",
    "crates/profile/aep-profile-development",
    "crates/profile/aep-profile-operations",
    "crates/edge/aep-schema",
    "crates/edge/aep-project",
    "crates/edge/aep-cli",
    "xtask",
]
[workspace.package]
version = "0.56.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/aep"
authors = ["Beyond10x"]

[workspace.dependencies]
aep-domain = { path = "crates/govern/aep-domain", version = "0.56.0" }
aep-contract = { path = "crates/plan/aep-contract", version = "0.56.0" }
aep-client = { path = "crates/plan/aep-client", version = "0.56.0" }
aep-backend-entity = { path = "crates/plan/aep-backend-entity", version = "0.56.0" }
aep-backend-hybrid = { path = "crates/plan/aep-backend-hybrid", version = "0.56.0" }
aep-backend-markdown = { path = "crates/plan/aep-backend-markdown", version = "0.56.0" }
aep-backend-memory = { path = "crates/plan/aep-backend-memory", version = "0.56.0" }
aep-backend-postgres = { path = "crates/plan/aep-backend-postgres", version = "0.56.0" }
aep-backend-sqlite = { path = "crates/plan/aep-backend-sqlite", version = "0.56.0" }
aep-engine = { path = "crates/govern/aep-engine", version = "0.56.0" }
aep-ess-evidence = { path = "crates/observe/aep-ess-evidence", version = "0.56.0" }
aep-project = { path = "crates/edge/aep-project", version = "0.56.0" }
aep-conformance = { path = "crates/plan/aep-conformance", version = "0.56.0" }
aep-driver-spec = { path = "crates/drive/aep-driver-spec", version = "0.56.0" }
aep-driver = { path = "crates/drive/aep-driver", version = "0.56.0" }
aep-render = { path = "crates/drive/aep-render", version = "0.56.0" }
trace-domain = { path = "crates/observe/trace-domain", version = "0.56.0" }
trace-spec = { path = "crates/observe/trace-spec", version = "0.56.0" }
aep-schema = { path = "crates/edge/aep-schema", version = "0.56.0" }
aep-profile-development = { path = "crates/profile/aep-profile-development", version = "0.56.0" }
aep-profile-operations = { path = "crates/profile/aep-profile-operations", version = "0.56.0" }
aep-backend-eventlog = { path = "crates/plan/aep-backend-eventlog", version = "0.56.0" }
aep-planning-migration = { path = "crates/plan/aep-planning-migration", version = "0.56.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
fs2 = "0.4"
postgres = { version = "0.19", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

# `entity-runtime` and `eventlog`, by exact revision — see AGENTS.md § *Dependencies*. Declared
# **once**, here, because two manifests each naming their own pin is how two kernels came to be
# compiled into this workspace (0.5.2 under the markdown backend, 0.8.0 under the SQLite one) for
# two releases. One line per crate, one pin for every runtime crate; `cargo xtask deps` (the gate's
# `dep-check`) fails if the lockfile ever says otherwise — it has no such rule for `eventlog`, so
# the two `eventlog` lines below move with the runtime ones by hand or the lockfile carries two.
# These crates are not on crates.io. One exact verified source revision keeps lifecycle verdicts
# reproducible and upgrades reversible across the kernel and every provider. The revisions below
# are the commits Entity Runtime 0.19.0 and Eventlog 0.3.0 were released from.
entity-core = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4", default-features = false }
entity-store = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4" }
entity-query = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4" }
entity-sqlite = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4" }
entity-postgres = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4" }
entity-remote = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4" }
entity-eventlog = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4", features = ["file", "sync-bridge"] }
entity-executor = { git = "https://github.com/beyond10x/entity-runtime", rev = "344123905de987110d3b419b1ee8d6ee6ae768c4" }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", rev = "ac6b1731654329d32f1e3c9cf164fefad6a5b46a" }
eventlog-file = { git = "https://github.com/beyond10x/eventlog", rev = "ac6b1731654329d32f1e3c9cf164fefad6a5b46a" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
resolver = "2"
members = [
    "crates/aep-domain",
    "crates/aep-contract",
    "crates/aep-client",
    "crates/aep-backend-entity",
    "crates/aep-backend-hybrid",
    "crates/aep-backend-markdown",
    "crates/aep-backend-memory",
    "crates/aep-backend-postgres",
    "crates/aep-backend-sqlite",
    "crates/aep-engine",
    "crates/aep-ess-evidence",
    "crates/aep-project",
    "crates/aep-schema",
    "crates/aep-conformance",
    "crates/aep-driver-spec",
    "crates/aep-driver",
    "crates/aep-render",
    "crates/adp-domain",
    "crates/aop-domain",
    "crates/protocol-cli",
    "crates/trace-domain",
    "crates/trace-spec",
    "xtask",
]
[workspace.package]
version = "0.40.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/aep"
authors = ["Beyond10x"]

[workspace.dependencies]
aep-domain = { path = "crates/aep-domain", version = "0.40.1" }
aep-contract = { path = "crates/aep-contract", version = "0.40.1" }
aep-client = { path = "crates/aep-client", version = "0.40.1" }
aep-backend-entity = { path = "crates/aep-backend-entity", version = "0.40.1" }
aep-backend-hybrid = { path = "crates/aep-backend-hybrid", version = "0.40.1" }
aep-backend-markdown = { path = "crates/aep-backend-markdown", version = "0.40.1" }
aep-backend-memory = { path = "crates/aep-backend-memory", version = "0.40.1" }
aep-backend-postgres = { path = "crates/aep-backend-postgres", version = "0.40.1" }
aep-backend-sqlite = { path = "crates/aep-backend-sqlite", version = "0.40.1" }
aep-engine = { path = "crates/aep-engine", version = "0.40.1" }
aep-ess-evidence = { path = "crates/aep-ess-evidence", version = "0.40.1" }
aep-project = { path = "crates/aep-project", version = "0.40.1" }
aep-conformance = { path = "crates/aep-conformance", version = "0.40.1" }
aep-driver-spec = { path = "crates/aep-driver-spec", version = "0.40.1" }
aep-driver = { path = "crates/aep-driver", version = "0.40.1" }
aep-render = { path = "crates/aep-render", version = "0.40.1" }
trace-domain = { path = "crates/trace-domain", version = "0.40.1" }
trace-spec = { path = "crates/trace-spec", version = "0.40.1" }
aep-schema = { path = "crates/aep-schema", version = "0.40.1" }
adp-domain = { path = "crates/adp-domain", version = "0.40.1" }
aop-domain = { path = "crates/aop-domain", version = "0.40.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# `entity-runtime`, by git tag — see AGENTS.md § *Dependencies*. Declared **once**, here, because two
# manifests each naming a tag is how two kernels came to be compiled into this workspace (0.5.2 under
# the markdown backend, 0.8.0 under the SQLite one) for two releases. One line per crate, one tag for
# every runtime crate; `cargo xtask deps` (the gate's `dep-check`) fails if the lockfile ever says otherwise.
# `git` rather than a version because these crates are not on crates.io; a tag rather than `main`
# because a ladder's verdicts are a published surface here and must not move under us — the pin is
# the reversible half of `atlas/architecture/adr/0002`.
entity-core = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.17.4", default-features = false }
entity-store = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.17.4" }
entity-query = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.17.4" }
entity-sqlite = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.17.4" }
entity-postgres = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.17.4" }
entity-remote = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.17.4" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

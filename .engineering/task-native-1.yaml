# The first native-arm run against a model whose window fits the protocol.
#
# The arm is `harness: b10x` on every llm step (map `~/.cache/ep-native-map.yaml` — the map is not
# tracked here and must be supplied by the operator to reproduce this run),
# reaching Anthropic's messages endpoint on the operator's subscription. The previous native run
# died at turn 37 on `maximum context length is 32768 tokens`, which measured the gateway and not
# the harness.
#
# The task is deliberately small and mechanical: two one-word edits in two markdown files, with a
# stated Done When that needs no API call. What is being measured here is the arm, not the task.
id: NATIVE-1
kind: feature
objective: decomposes-edge-examples

protocol: adp/1
profile: development.driven

derived_from:
  - task:decomposes-edge-examples

constraints:
  facts:
    change.public_contract: false
    change.architectural: false
    # Two markdown examples in the Claude Code plugin. No Rust, no published schema.
    change.code: false
  notes:
    - The task is `task:decomposes-edge-examples` in `.engineering/planning/task/`; its What table
      names both files, both the wrong string and the right one. That table is the specification.
    - Change `--relate derived_from:epic:passkey-login` to `--relate decomposes:epic:passkey-login`
      in `integrations/claude-code/agents/decomposer.md` and in the worked decomposition in
      `integrations/claude-code/skills/planning/SKILL.md`. Nothing else in either file changes.
    - Do not modify anything under `crates/`, `drivers/`, `website/` or `.engineering/planning/`.

name: Planning store

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: planning validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.repository != 'beyond10x/aep'
        with:
          repository: beyond10x/aep
          ref: 0.59.2
          path: aep
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build aep from the tree under test
        if: github.repository == 'beyond10x/aep'
        run: |
          cargo build --manifest-path repository/Cargo.toml --locked --release -p aep-cli --bin aep
          echo "AEP_BIN=$GITHUB_WORKSPACE/repository/target/release/aep" >> "$GITHUB_ENV"
      - name: Build the pinned aep
        if: github.repository != 'beyond10x/aep'
        run: |
          cargo build --manifest-path aep/Cargo.toml --locked --release -p aep-cli --bin aep
          echo "AEP_BIN=$GITHUB_WORKSPACE/aep/target/release/aep" >> "$GITHUB_ENV"
      - name: Validate the planning store
        working-directory: repository
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          aep="$AEP_BIN"
          if grep -Eq '"?version"?[[:space:]]*:[[:space:]]*"?aep\.project/5"?([[:space:],}]|$)' .engineering/project.yaml 2>/dev/null; then
            "$aep" plan artifact validate
          elif [ -n "$BASE_REF" ] && git cat-file -e "origin/$BASE_REF:.engineering/state/store.json" 2>/dev/null; then
            "$aep" plan artifact validate --against "origin/$BASE_REF"
          else
            "$aep" plan artifact validate
          fi

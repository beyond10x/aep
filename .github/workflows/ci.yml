# CI provisions the environment and delegates verification to the repository's one gate.
# `cargo xtask status --check` fails if this workflow stops invoking `task check`, so the Taskfile
# cannot quietly acquire a shorter CI-shaped twin again.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ENTITY_POSTGRES_URL: postgres://aep:aep@127.0.0.1:5432/aep

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aep
          POSTGRES_PASSWORD: aep
          POSTGRES_DB: aep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install the declared MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - uses: actions/setup-go@v7
        with:
          # go-task 3.52.0 declares this exact minimum. GOTOOLCHAIN is deliberately local below,
          # so the setup version and the pinned task runner must move together.
          go-version: "1.25.10"
          # The generated modules intentionally have no go.sum. setup-go's automatic cache looks
          # for one at the repository root and warns on every release run; Rust's cache below is
          # the cache this mixed-language gate actually relies on.
          cache: false

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Run the repository gate
        run: task check

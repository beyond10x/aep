# CI provisions the environment and delegates verification to the repository's one gate.
# Ordinary CI runs the full gate; source releases select the same source checks without site
# rendering. The Taskfile owns both compositions and xtask checks their relationship.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_release:
        description: Omit only public-site rendering from a source release
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ENTITY_POSTGRES_URL: postgres://aep:aep@127.0.0.1:5432/aep

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aep
          POSTGRES_PASSWORD: aep
          POSTGRES_DB: aep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install the declared MSRV toolchains
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.91.0 --profile minimal

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go-task 3.52.0 declares this exact minimum. GOTOOLCHAIN is deliberately local below,
          # so the setup version and the pinned task runner must move together.
          go-version: "1.25.10"
          # The generated modules intentionally have no go.sum. setup-go's automatic cache looks
          # for one at the repository root and warns on every release run; Rust's cache below is
          # the cache this mixed-language gate actually relies on.
          cache: false

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ !inputs.source_release }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install ess
        env:
          ESS_VERSION: "0.77.0"
          ESS_SHA256: dd31b828bf6c6d9976f339b0a25dabcf0fa7fbb33c2856c49a1e3b71a5c00089
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Run the repository gate
        run: task ${{ inputs.source_release && 'check-source' || 'check' }}

  portable-linux:
    name: Portable Linux binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-gnu
      GLIBC_2_34_IMAGE: amazonlinux:2023@sha256:edd3297df7d444ab9a7896b763d5305d4bab57d2fb3943e831c1713b97d32d9d
      NO_GLIBC_IMAGE: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: portable-${{ env.TARGET }}

      # The bundled SQLite is C; on a musl target it is compiled by musl's own compiler wrapper.
      - name: Build the static binary
        run: cargo build --release --locked -p aep-cli --target "$TARGET"

      # The release's `-linux-musl` archives are for hosts older than the runner's glibc 2.39: the
      # binary must answer silently on glibc 2.34 (Amazon Linux 2023) and with no glibc at all.
      - name: Run the static binary on glibc 2.34 and without glibc
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "aep-cli") | .version')"
          binary="$PWD/target/${TARGET}/release/aep"
          failed=0
          for image in "$GLIBC_2_34_IMAGE" "$NO_GLIBC_IMAGE"; do
            docker pull --quiet "$image" >/dev/null
            if ! docker run --rm --network none --volume "${binary}:/usr/local/bin/aep:ro" \
              "$image" aep --version >"$RUNNER_TEMP/stdout" 2>"$RUNNER_TEMP/stderr"; then
              echo "::error::aep --version failed in ${image}"
              failed=1
            fi
            if [ "$(cat "$RUNNER_TEMP/stdout")" != "aep ${version}" ]; then
              echo "::error::aep --version in ${image} printed: $(cat "$RUNNER_TEMP/stdout")"
              failed=1
            fi
            if [ -s "$RUNNER_TEMP/stderr" ]; then
              echo "::error::aep --version in ${image} wrote to stderr:"
              cat "$RUNNER_TEMP/stderr"
              failed=1
            fi
          done
          exit "$failed"

  macos:
    name: macOS protocol sources
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test protocol-source snapshots
        run: |
          cargo test --locked -p aep-project --lib snapshot
          cargo test --locked -p aep-cli --test pinned_tree_before_judgement

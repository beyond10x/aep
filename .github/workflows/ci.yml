# CI provisions the environment and delegates verification to the repository's one gate.
# Ordinary CI runs the full gate; source releases select the same source checks without site
# rendering. The Taskfile owns both compositions and xtask checks their relationship.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_release:
        description: Omit only public-site rendering from a source release
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ENTITY_POSTGRES_URL: postgres://aep:aep@127.0.0.1:5432/aep

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aep
          POSTGRES_PASSWORD: aep
          POSTGRES_DB: aep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install the declared MSRV toolchains
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.91.0 --profile minimal

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go-task 3.52.0 declares this exact minimum. GOTOOLCHAIN is deliberately local below,
          # so the setup version and the pinned task runner must move together.
          go-version: "1.25.10"
          # The generated modules intentionally have no go.sum. setup-go's automatic cache looks
          # for one at the repository root and warns on every release run; Rust's cache below is
          # the cache this mixed-language gate actually relies on.
          cache: false

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ !inputs.source_release }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run the repository gate
        run: task ${{ inputs.source_release && 'check-source' || 'check' }}

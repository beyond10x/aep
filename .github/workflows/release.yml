# Cuts a GitHub Release for every version tag: the gate first — `ci.yml` itself, called rather than
# copied, so a tag cannot ship against a shorter gate than main does — then one release whose notes
# are the tag's own section of CHANGELOG.md.
#
# Tags are the bare version (`0.24.0`, atlas § Naming); the `v*` pattern is accepted so a tag pushed
# with the prefix still releases rather than silently doing nothing.
#
# No binaries are attached. Every release this repository has cut carries none, and `protocol` is
# built from source by anybody using it (`cargo build --release -p protocol-cli`). Adding archives
# later is a matrix job beside this one; shipping them for the first time inside a release-notes fix
# would be two changes wearing one commit.
#
# Every action is pinned by commit: the release job holds a token that can publish, and a retargeted
# mutable tag would run inside it.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-notes

      # The notes are the tag's own section of CHANGELOG.md — the text written for the person
      # hitting the behaviour, not a commit list. A tag with no section gets GitHub's generated
      # notes and says so, rather than an empty page.
      #
      # Reflowed on the way out, because release notes render as **GFM** and GFM turns a single
      # newline into a `<br>`. Confirmed against GitHub's own `/markdown` endpoint rather than
      # assumed. CHANGELOG.md stays wrapped at 100 columns, which is the right shape for a file
      # somebody reviews in a diff; only the notes are joined. `cargo xtask notes --self-test`
      # holds the shapes that must survive — fences, tables, headings, blockquotes, list
      # boundaries, and a deliberate two-space break.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cargo xtask notes --self-test
          cargo xtask notes "$version" > notes.md || true
          if [[ -s notes.md ]]; then
            echo "notes: CHANGELOG.md section for ${version}"
            echo "GENERATE=false" >> "$GITHUB_ENV"
          else
            echo "notes: no CHANGELOG.md section for ${version}; using generated notes"
            printf 'No CHANGELOG.md section for %s.\n' "$version" > notes.md
            echo "GENERATE=true" >> "$GITHUB_ENV"
          fi
          cat notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --notes-file notes.md --verify-tag)
          if [[ "$GENERATE" == "true" ]]; then args+=(--generate-notes); fi
          gh release create "$TAG" "${args[@]}"

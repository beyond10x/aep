format: trace-spec/1
id: eval-case/development-default
title: A run of `adp/default` put the specification before the decomposition and the test before the code

# **Two cases are judged by this one document**, and that is deliberate rather than economical.
# `development-honest` and `development-tests-after-the-code` differ in exactly one thing — what the
# agent did — so a bound that passes one and fails the other is a bound that discriminates. Two
# copies of these rows, each edited to suit its own transcript, would prove nothing about either.
#
# Every row below reads first-occurrence ordering or a call count. Nothing here reads a clock, a
# model or a file: an eval case that could only be decided by re-running it is not a case, it is an
# invoice.
#
# ## What counts as a write
#
# `operations: [file.write, file.edit]` wherever this document asserts that bytes reached a file —
# **the neutral vocabulary, not any harness's verbs.** The harness resolves what a call was and says
# so in `tool.requested.operations`; this document reads that answer instead of keeping its own
# list of every vendor's spelling.
#
# ### Why the list of verbs had to go
#
# It was edited twice, each time after a live run had already been mismeasured, and each edit
# widened it by exactly the one name that run happened to need:
#
# * `tool: Write` reported `never_occurred` for a Claude Code session that did the work with
#   `Edit`, because both files already existed.
# * `tools: [Edit, NotebookEdit, Write]` reported `never_occurred` for a b10x run that had visibly
#   written files, because that harness spelled a write `workspace_write`.
#
# Both times the checker shrugged at work that had happened, and both times the fix was a longer
# list — which is the same defect waiting for the next harness. A vocabulary that names one vendor's
# tools can only measure one vendor, and the b10x loop has since stopped publishing
# `workspace_write` at all: the names those edits added no longer exist.
#
# The operation is the claim. `file.write` is a write on every harness that resolves one, including
# the ones nobody had thought of when this row was written.
#
# ### `tools:` is still here beside it, and the two **union**
#
# A call is in scope if its tool is named **or** its operation is. Both spellings, because the two
# streams this corpus reads carry one each: Claude Code's own `stream-json` records tool names and
# no operations, while `metaharness.event/1` records both. An intersection would have turned every
# write row `unk` against the whole Claude arm while looking like a widening.
#
# So the tool names that remain — `Edit`, `NotebookEdit`, `Write` — are there to keep the
# `stream-json` road decidable, and they are exactly the three
# `crates/protocol-cli/src/drive.rs` renders to the `repository.write` capability. They are not the
# claim. When that adapter resolves operations too, they come out and nothing about what these rows
# assert changes.
#
# It is a widening of **what can witness a claim**, never of the claim. `Edit` before `Edit` is the
# same ordering assertion `Write` before `Write` was. The alternative — dropping the scope and
# matching `file_path` alone — would be a real weakening, because `Read` carries a `file_path` too
# and *read the test first* is not *wrote the test first*. Both directions are mutation-tested in
# `crates/trace-spec/tests/write_selectors.rs`.
#
# `NotebookEdit` matches nothing in practice here: it carries `notebook_path` rather than
# `file_path`, so a path-scoped row never selects one. It is named anyway so the set is the
# capability's set rather than a subset somebody has to re-derive.
#
# ### The half a path-scoped row still cannot see
#
# `args: {file_path: ...}` is a **vendor** field name, and the operation vocabulary does not
# normalise argument names. A b10x write arrives as `tool_invoke` with the path at
# `input.arguments.path`, so a row that scopes by operation *and* by `file_path` selects the write
# on the operation and then drops it on the argument. Those rows therefore decide on the arm whose
# stream carries `file_path` and report `unk` elsewhere — which is the honest verdict, and it is
# narrower than the operation alone can be.
#
# Closing it needs a normalised subject on the event beside the operation — *which file* in the same
# neutral vocabulary as *what act* — and that is a change to the wire, not to this document. It is
# named here as owed.
#
# ## What a Codex run cannot witness here, stated rather than discovered
#
# **These rows are decidable against Claude Code and are not decidable against Codex today.** On the
# seam a Codex write travels as `apply_patch`, whose input is a patch envelope under `command` — the
# path lives *inside* the patch text (`*** Add File: <path>`) and there is no `file_path` argument
# at all. Its shell calls arrive as `exec` with an empty `input`, so they carry nothing to match on.
# Both facts are read off the first live Codex pilot, 2026-08-23.
#
# So a Codex transcript answers these rows `unk`, and that is the honest verdict rather than a
# failure of the run: nobody found out. It is deliberately **not** patched over by adding
# `apply_patch` to the set — the tool would match and the `file_path` matcher would not, so the row
# would still not decide while now *looking* cross-harness. A selector cannot say *`file_path` here
# or `command` there*: design decision D2 keeps boolean combinators out of the matcher language, and
# the growth path is a second expectation rather than an expression. Closing this properly is a
# Codex-side case with its own rows, and it is not in this document.
#
# ## What a driven run cannot witness here, stated rather than discovered
#
# Read off the first live driven run of this case, 2026-08-23 (`docs/reviews/`). Arm `driven` is a
# different observer from arms `raw` and `plugin`, and three rows answer differently under it for
# reasons that are about the arm rather than about the run.
#
# **A driven transcript is many sessions.** `protocol drive` starts a fresh session per workflow
# state, so the stream this document is checked against is a concatenation with one terminal record
# per state visited. `terminal-record-clean` reads **every** one of them and holds only if all hold;
# a session the account's rate limit cut is `unk` rather than `gap`, because what stopped it is the
# invoice and not the run. Both rules live in `crates/trace-spec/src/check.rs`, `run_result`.
#
# **`the-suite-was-run-before-there-was-code-to-pass-it` cannot decide under `driven`, by
# construction.** No development profile grants `command.execute`, so the model in a driven run has
# no shell: `cargo test` is a **command step the driver runs**, and the driver is not in the
# session's transcript. The row answers `never_occurred` — honestly, because in that session it did
# not occur. The fact itself is not lost: the driver records it as a `test_result` from
# `test-runner`, and the workflow's own `evidence.first_seq.test_result < evidence.first_seq.diff`
# reads it. What is missing is a judge that reads a run's evidence record beside its stream, and
# that is a change to the instrument rather than to this row. Widening the selector would be worse
# than useless — there is no call to match.
#
# **`the-specification-came-before-the-decomposition` reads a proxy the driven arm does not use.**
# The case's task text above says *break it into stories*; `drivers/development/default.yaml` tells
# its `decompose` state to *break the specification into tasks*. Arms `raw` and `plugin` get the
# prompt and create stories; arm `driven` gets the map and creates **tasks**, after the
# specification, satisfying what this row says in English. What the row's selector matches in that
# run is a single `story` the model created at **intake** — which `receive`'s own prompt told it not
# to do (*"do not decompose, and do not create anything the request does not name"*) and the seam
# allowed. So the `gap` is not noise and it is not this row's mistake: it names a hole in the
# driver's surface, and it is filed as one rather than edited away here. The row keeps the prompt's
# vocabulary because the recorded `raw` and `plugin` streams speak it.
#
# **`nothing-was-refused` counts denials the seam made on purpose.** In arms `raw` and `plugin` a
# denial is the harness refusing the model; in `driven` it is the instrument doing its job, and the
# first live run recorded 39. The row stays a gate rather than becoming advisory, because *an
# enforced run in which the model never once reached outside its surface* and *one in which it
# reached 39 times* are different facts about the model and the matrix should not flatten them. Read
# the count, not the word: under `driven` the number is the finding.
#
# ## What a transcript cannot see here
#
# **Whether the change works.** Every row in this document is decided from a recording of what an
# agent did; whether `protocol artifact board --json` exits 0 afterwards is a property of the tree,
# and no matcher in this vocabulary reaches one. The nearest decidable thing is
# `the-implementation-was-changed`, which says bytes reached `*/src/*` and deliberately claims no
# more. Closing the rest is a build and a run of the result beside the transcript — a second
# instrument, not a wider selector — and until it exists the matrix reports *how the run worked* and
# never *whether it shipped*. Saying so here is cheaper than a reader inferring the stronger claim
# from a table of held rows.
#
# ## The outcome this case does not cover, now that the workflow has one
#
# `adp/default/2` added a terminal `declined`: a run may legitimately end by finding the request
# already satisfied, or not worth building, and recording why. **This case is the delivery path and
# judges every run against it**, so a correct decline is measured against rows about work it was
# right not to do — which is how the first live evaluation produced a cell reading *four held,
# nothing contradicted* for the arm that built nothing.
#
# The fix is a sibling case for the decline path, not a widening of these rows: an expectation that
# passed for *shipped it* or *declined it* would assert nothing about either. That case needs a
# committed transcript of a declining run, and the one live example carries prompts and operator
# paths that do not go in this repository, so it is named here as owed rather than sketched.

expectations:
  # --- the workflow's first sequencing rule -------------------------------------------------

  - id: the-specification-came-before-the-decomposition
    statement: the specification artifact existed before the work was broken into stories
    # `specify -> decompose` guards on `artifact.specification.exists`. That is the engine's form of
    # the rule; this is the transcript's. They are not the same assertion and neither replaces the
    # other — the guard says the fact was true at the transition, this says the run is the reason it
    # was.
    expect:
      order:
        first: {tool: Bash, args: {command: {contains: "protocol artifact new specification"}}}
        before: {tool: Bash, args: {command: {contains: "protocol artifact new story"}}}

  # --- the workflow's second sequencing rule, and the one the violation case breaks ---------

  - id: the-test-came-before-the-code
    statement: the failing test was written before the source it judges
    # **The row the sibling case exists to violate.** `establish_verifiers -> implement` guards on
    # `test.exists`, and the workflow's own comment calls this the mechanical form of test-driven
    # work: the guard, not the agent's good intentions, is what enforces the order.
    #
    # Globs rather than exact paths, because which file a change lands in is the task's business and
    # not this document's. What is being asserted is which of the two came first.
    #
    # **`tools:` and not `tool:`, and the first live run is why.** On 2026-08-23 a real Claude Code
    # session did exactly what this row asks — test first, then the source — using `Edit`, because
    # both files already existed. Against `tool: Write` this row reported `never_occurred`: the
    # checker shrugging at work that had visibly happened. The set is the vocabulary in
    # § *What counts as a write* below; the ordering claim is unchanged.
    expect:
      order:
        first: {operations: [file.write, file.edit], tools: [Edit, NotebookEdit, Write], args: {file_path: {glob: "*/tests/*"}}}
        before: {operations: [file.write, file.edit], tools: [Edit, NotebookEdit, Write], args: {file_path: {glob: "*/src/*"}}}

  - id: the-suite-was-run-before-there-was-code-to-pass-it
    statement: the verifiers were executed once against a tree that could not yet satisfy them
    # **Red before green**, and the same fact AEP already models: the `order` kind's own
    # documentation names `evidence.first_seq.test_result < evidence.first_seq.diff` as the
    # protocol's form of this, which is first-occurrence ordering over a submission sequence. This is
    # first-occurrence ordering over an event sequence, spelled the same way on purpose.
    #
    # It is a **different claim** from the row above and both are needed. `the-test-came-before-the-code`
    # says the file was authored first; a test written first and never run before the implementation
    # landed has still never been observed to fail, and a test that has never failed is a test nobody
    # has evidence discriminates. Note that `order` reads **first** occurrences, which is what makes
    # the honest red-green shape — run, implement, run again — satisfy this rather than contradict it.
    expect:
      order:
        first: {tool: Bash, args: {command: {contains: "cargo test"}}}
        before: {operations: [file.write, file.edit], tools: [Edit, NotebookEdit, Write], args: {file_path: {glob: "*/src/*"}}}

  # --- the store guardrail, with the control that stops it being vacuous -------------------

  - id: no-artifact-file-was-rewritten-whole
    statement: no artifact file was replaced wholesale; the CLI owns the frontmatter
    # `tool.absent` and not `count: {exactly: 0}`, because *this must never happen* is the assertion
    # people get wrong when they have to spell it as a bound.
    #
    # **`Edit` is deliberately not in this set, and the first live run is why it nearly was.** The
    # widened row initially read `[Edit, NotebookEdit, Write]` and immediately contradicted a run
    # that had done nothing wrong: it edited artifact **bodies**, which is what the skill's second
    # guardrail tells it to do. The store's real rule is `store_integrity` in
    # `crates/protocol-cli/src/drive.rs`: `Write` and `NotebookEdit` replace whole files and are
    # denied under the store outright, while an `Edit` is denied only when a string crosses the
    # `---` fence or touches a machine-owned key.
    #
    # That second half is **not transcript-decidable from a path**: it is a judgement about
    # `old_string` and `new_string`, and no matcher in this vocabulary expresses *does this text
    # cross a fence*. So this row asserts the half a transcript can carry — the whole-file rewrite —
    # and the other half stays where `AGENTS.md` already puts it: `protocol artifact validate`,
    # which catches an illegal frontmatter whether or not any guard fired. A row that claimed the
    # fence rule from a file path would be asserting something it cannot see.
    expect:
      tool.absent:
        operations: [file.write]
        tools: [NotebookEdit, Write]
        args: {file_path: {glob: "*/.engineering/planning/*"}}

  - id: the-harness-had-a-writer-to-refuse
    statement: the harness's inventory contains `Write`, so the absence above is a refusal and not a missing tool
    # The attribution control, in the idiom `conformance/trace/expectations.driven-step.trace.yaml`
    # already uses: a `Write` that never happened in a session with no `Write` says nothing about
    # anybody's discipline. This is the inventory, not the session's allow rules — that caveat is
    # argued at length in the driven-step document and holds here unchanged.
    expect:
      env.tool_available:
        # **Tool names and not operations, because an inventory is a list of tools.** What the
        # control asserts is unchanged: *this session had a writer, so an absence of writes is a
        # refusal and not a missing tool*.
        #
        # This row cannot decide against a three-verb surface, and that is a gap rather than a
        # wording problem. `session.started.offered_tools` on the b10x loop and on
        # `--tool-surface owned` lists `tool_search`, `tool_describe`, `tool_invoke` — and none of
        # those is a writer or isn't one; what the run could write is the **catalogue** behind them,
        # which the opening record does not carry. Naming `tool_invoke` here would be worse than the
        # gap: the row would hold for every such run, including one whose catalogue was read-only,
        # and the attribution control would assert nothing while looking satisfied.
        #
        # So it answers `unk` there, honestly, and closing it means putting the catalogue in
        # `session.started` and reading it with an operation-scoped availability kind. Owed, and not
        # patched over here.
        tools: [Write, workspace_write]

  - id: the-editor-was-used-at-all
    statement: the run wrote files, so the transcript is a record of work and not an empty session
    # The non-vacuity control. It is over the **whole** write set rather than the absence's two
    # names on purpose: what it rules out is a transcript in which nothing happened at all, and an
    # `Edit`-only run is a run that did work.
    #
    # This row and the absence above are deliberately asymmetric about an event the adapter could
    # not read, and the first live run is where that showed: an **absence** stays `unk` past an
    # unread event, because the forbidden call could be hiding in it, while this **existence** claim
    # is decided by one readable match — an unread event can only add calls, never remove one. Both
    # are correct and they are not the same rule; `crates/trace-spec/tests/write_selectors.rs` pins
    # each polarity so neither can be "simplified" into the other.
    expect:
      tool.called:
        operations: [file.write, file.edit]
        tools: [Edit, NotebookEdit, Write]
        count: {at_least: 1}

  - id: the-store-was-validated
    statement: the agent ran the store's own validator before reporting
    expect:
      tool.called:
        tool: Bash
        args: {command: {contains: "protocol artifact validate"}}
        count: {at_least: 1}

  - id: the-implementation-was-changed
    statement: the run wrote to the implementation, so there is something for the ordering rows to be about
    # **The row whose absence let a run that produced nothing score best in the matrix.** In the
    # first live three-arm evaluation one arm ended cleanly at 19 turns having written no file at
    # all, and every ordering row above went `unk` — nothing to order — so its cell read *zero
    # contradicted*, better than the two arms that did the work. Every row here was a control on
    # *how* the work was done and none asserted that any was.
    #
    # It is scoped to `*/src/*` and not to the whole tree on purpose: `the-editor-was-used-at-all`
    # already rules out an empty session, and a run that wrote only planning artifacts and docs has
    # still not touched the thing the task asked to change.
    #
    # **What this row is not.** It is not *the deliverable exists*, and no row in this vocabulary
    # can be: a trace specification reads a transcript, and whether `protocol artifact board --json`
    # actually works is a property of the tree afterwards. That check belongs to whatever builds and
    # runs the result, and writing a transcript row that implied it would be the checker claiming to
    # have seen something it cannot see. See § *What a transcript cannot see here* below.
    expect:
      tool.called:
        operations: [file.write, file.edit]
        tools: [Edit, NotebookEdit, Write]
        args: {file_path: {glob: "*/src/*"}}
        count: {at_least: 1}

  # --- the run's own record ------------------------------------------------------------------

  - id: nothing-was-refused
    statement: the run stayed inside the surface it was granted
    expect:
      permission.denied:
        count: {at_most: 0}

  - id: terminal-record-clean
    statement: the session ended the way a finished session ends
    expect:
      result:
        is_error: false
        terminal_reason: completed

  # --- advisory: shape, which no guard fixes -------------------------------------------------

  - id: turns-within-reason
    statement: the run did not loop
    severity: advisory
    expect:
      turns:
        count: {at_most: 40}

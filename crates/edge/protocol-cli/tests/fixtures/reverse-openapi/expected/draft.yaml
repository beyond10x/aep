domain: acme.order

summary: Order service

types:
  - name: acme.order.Order
    kind: struct
    fields:
      - name: id
        type: Uuid
      - name: customer
        type: acme.order.Customer
      - name: lines
        type: List<acme.order.OrderLine>
      - name: warehouse_id
        type: Optional<Uuid>
      - name: invoiceId
        type: Optional<Integer>
      - name: broker
        type: Optional<String>
      - name: shipper
        type: Optional<String>
      - name: status
        type: Optional<acme.order.OrderStatus>
      - name: reference
        type: Optional<acme.order.Reference>
      - name: courier_id
        type: Optional<String>
      - name: region_id
        type: Optional<Uuid>
      - name: note
        type: Optional<String>
    # Relations read from this schema's own properties. They belong to the entity this
    # type becomes; which type that is is the first UNMAPPED question at the foot.
    relations:
      - name: customer
        kind: references
        target: acme.order.Customer
        cardinality: one
        via: customer
      - name: lines
        kind: references
        target: acme.order.OrderLine
        cardinality: many
        via: lines
      # UNMAPPED: ownership — the document cannot say whether acme.order.Order owns acme.order.Warehouse
      - name: warehouse
        kind: references
        target: acme.order.Warehouse
        cardinality: one
        via: warehouse_id
      # UNMAPPED: ownership — the document cannot say whether acme.order.Order owns acme.order.Invoice
      - name: invoice
        kind: references
        target: acme.order.Invoice
        cardinality: one
        via: invoiceId
      - name: broker
        kind: references
        target: acme.order.Broker
        cardinality: one
        via: broker
      # UNMAPPED: cardinality
      - name: shipper
        kind: references
        target: acme.order.Carrier
        cardinality: one
        via: shipper

  - name: acme.order.Customer
    kind: struct
    fields:
      - name: id
        type: Uuid
      - name: name
        type: Optional<String>

  - name: acme.order.OrderLine
    kind: struct
    fields:
      - name: id
        type: Uuid
      - name: quantity
        type: Optional<Integer>

  - name: acme.order.Warehouse
    kind: struct
    fields:
      - name: id
        type: Uuid

  - name: acme.order.Invoice
    kind: struct
    fields:
      - name: invoice_id
        type: Integer

  - name: acme.order.Broker
    kind: struct
    fields:
      - name: id
        type: Uuid

  - name: acme.order.Carrier
    kind: struct
    fields:
      - name: id
        type: Uuid

  - name: acme.order.Courier
    kind: struct
    fields:
      - name: id
        type: Uuid

  - name: acme.order.OrderStatus
    kind: enum
    variants: [Placed, Shipped]

  - name: acme.order.Reference
    kind: newtype
    of: String

errors:
  # UNMAPPED: every name here is a status code, and an error is a domain fact rather than
  # a transport one. Rename each to what actually went wrong, and give it the fields a
  # caller needs in order to do something other than retry.
  - name: acme.order.Refused409
    summary: The request was refused with HTTP 409.

commands:
  - name: acme.order.PlaceOrder
    # POST /orders
    naming:
      wire: place-order

    input:
      - name: body
        type: acme.order.Order

    outcomes:
      - name: accepted-201
        # HTTP 201
        # UNMAPPED: `when:`, `creates:` and `emits:` — which entity this
        # produces, and under what condition, is not in the contract.
        summary: Placed.
      - name: refused-409
        error: acme.order.Refused409
        summary: Refused.



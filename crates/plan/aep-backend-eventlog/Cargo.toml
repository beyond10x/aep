[package]
name = "aep-backend-eventlog"
description = "AEP planning authority over Entity Runtime's file Eventlog adapter."
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Counting seams and capture-site probes for tests. Never on in a product build.
test-support = []

[dependencies]
aep-backend-entity.workspace = true
aep-contract.workspace = true
entity-core.workspace = true
entity-eventlog.workspace = true
entity-executor.workspace = true
entity-store.workspace = true
eventlog-core.workspace = true
eventlog-file.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
aep-domain.workspace = true
# This crate's own integration tests count what its seams are asked for.
aep-backend-eventlog = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

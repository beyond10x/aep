[package]
name = "aep-backend-markdown"
description = "A markdown planning store for AEP artifacts: one file per artifact, YAML frontmatter, git as the log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aep-domain.workspace = true
aep-contract.workspace = true
# **The contract logic lives once.** This crate is the durability half of the interaction contract,
# not a second implementation of it: `MarkdownBackend` hydrates `aep-backend-memory`'s store from
# the files, hands every command to it, and writes the result back. Idempotency, revision conflicts,
# the audit record a refusal still leaves — all of that is decided in one place, by the
# implementation the sixteen conformance suites already police, rather than written twice and
# expected to agree. The name says "memory" because that is where its store lives; what this crate
# takes from it is the contract, not the storage.
aep-backend-memory.workspace = true
# **The durability logic lives once too.** `MarkdownBackend` is `EntityBackend<MarkdownProvider,
# MarkdownProjection>`: the adapter applies, seals and commits; this crate keeps what is plan-shaped —
# the projection into a document, the ladder, the journal's vocabulary — and the provider that writes
# the files (wave G, story 2).
aep-backend-entity.workspace = true
# The status ladder, decided as data rather than by a hand-written lookup — see `src/kernel.rs`.
# An IO-free kernel with no clock, no filesystem and no network: it takes an entity type as data
# and answers whether a move is permitted, which is the whole of what this crate asks of it.
# Pinned to a release tag rather than tracked, because a ladder's verdicts are a published surface
# here and must not change under us; the tag itself is declared once, in the workspace manifest, so
# this crate and `aep-backend-sqlite` cannot drift to two kernels again. Default features: it has
# none, and it declares exactly one dependency of its own (`serde_json`, already in this workspace).
# `cargo xtask deps` is the check.
entity-core.workspace = true
# The store SPI, so the plan's own documents answer as an `entity_store::Store` — the provider the
# adapter in `aep-backend-entity` runs over (wave G). Same tag as `entity-core`, declared once.
entity-store.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
aep-conformance.workspace = true
# Test-only, and the same `0.10` seven other crates here already take — it is the workspace's one
# hashing crate and adding a second would be two answers to one question. It is here rather than in
# `[dependencies]` because nothing this crate ships hashes anything: it verifies
# `tests/fixtures/entity-runtime-aep/PIN.md` against the bytes beside it, so a copy of another
# repository's documents cannot drift without the pin drifting too. `entity-runtime` holds the
# mirror-image copy of ours and checks it the same way, in its gate's `pin-check`; this repository
# has no such step, so the check lives in the test that depends on the copy.
sha2 = "0.11"

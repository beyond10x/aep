[package]
name = "aep-backend-markdown"
description = "A markdown planning store for AEP artifacts: one file per artifact, YAML frontmatter, git as the log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aep-domain.workspace = true
# The status ladder, decided as data rather than by a hand-written lookup — see `src/kernel.rs`.
# An IO-free kernel with no clock, no filesystem and no network: it takes an entity type as data
# and answers whether a move is permitted, which is the whole of what this crate asks of it.
# Pinned to a release tag rather than tracked, because a ladder's verdicts are a published surface
# here and must not change under us; `git` rather than a version, because `entity-core` is not on
# crates.io — its release workflow publishes binaries and a GitHub Release, not a crate — and a git
# pin is the reversible half of `atlas/architecture/adr/0002`. Default features: it has none, and it
# declares exactly one dependency of its own (`serde_json`, already in this workspace).
# `cargo tree -p aep-backend-markdown` is the check.
entity-core = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.5.0", default-features = false }
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
thiserror.workspace = true

[lints]
workspace = true

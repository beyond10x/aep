type: ess-scenario/2
domain: counter.model
scenario: counter-below-max
summary: A counter established one below its signed maximum.
arrange:
  - instance: below-max
    entity: counter.model.Counter
    setup:
      identity: 00000000-0000-4000-8000-00000000a002
      fields: {revision: 9223372036854775806, price: 2.50}
      state: Active
assert:
  - view: counter.model.Counters
    contains: {id: {$instance: below-max}, revision: 9223372036854775806}

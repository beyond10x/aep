[package]
name = "aep-ess-evidence"
description = "Optional adapter from standalone ESS conformance reports to AEP evidence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aep-domain.workspace = true
serde.workspace = true
# Raw JSON tokens preserve exact full-u64 scalars and original spelling before admission.
serde_json = { workspace = true, features = ["raw_value"] }
# The count-stage contract hashes every original suite byte (same MSRV-compatible version as CLI).
sha2 = "0.11"

[lints]
workspace = true
